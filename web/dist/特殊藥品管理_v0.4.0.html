// ---- ui/dom.js ----
const __m_ui_dom_js = (function () {
// 極小DOM輔助：一律以 textContent 放文字，不用 innerHTML。
function h(tag, props, ...children) {
  const el = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v === undefined || v === null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'on') for (const [ev, fn] of Object.entries(v)) el.addEventListener(ev, fn);
      else if (k === 'style') el.setAttribute('style', v);
      else if (k in el && typeof v !== 'string') el[k] = v;
      else el.setAttribute(k, v === true ? '' : String(v));
    }
  }
  append(el, children);
  return el;
}

function append(el, children) {
  for (const c of children) {
    if (c === null || c === undefined || c === false) continue;
    if (Array.isArray(c)) append(el, c);
    else if (c instanceof Node) el.appendChild(c);
    else el.appendChild(document.createTextNode(String(c)));
  }
}

function clear(el) {
  while (el.firstChild) el.removeChild(el.firstChild);
  return el;
}

function table(headers, rows) {
  return h('table', null,
    h('thead', null, h('tr', null, headers.map((x) => h('th', { text: x })))),
    h('tbody', null, rows.map((r) => h('tr', null, r.map((c) => (c instanceof Node ? h('td', null, c) : h('td', { text: c === null || c === undefined ? '' : String(c) })))))));
}

// 模態對話框；buttons：[{label, value, primary}]；回傳 Promise<value>（Esc→null）
function dialog(title, body, buttons) {
  return new Promise((resolve) => {
    const dlg = h('dialog', { class: 'dlg', 'aria-label': title });
    const done = (v) => { dlg.close(); dlg.remove(); resolve(v); };
    dlg.appendChild(h('h2', { text: title }));
    dlg.appendChild(h('div', { class: 'dlg-body' }, body));
    const bar = h('div', { class: 'dlg-buttons' });
    for (const b of buttons) {
      bar.appendChild(h('button', { type: 'button', class: b.primary ? 'primary' : '', text: b.label, on: { click: () => {
        if (b.validate && !b.validate()) return;
        done(b.value);
      } } }));
    }
    dlg.appendChild(bar);
    dlg.addEventListener('cancel', (e) => { e.preventDefault(); done(null); });
    document.body.appendChild(dlg);
    dlg.showModal();
  });
}

function alertBox(title, ...lines) {
  return dialog(title, lines.map((l) => (l instanceof Node ? l : h('p', { text: l }))), [{ label: '確定', value: true, primary: true }]);
}

return { h, clear, table, dialog, alertBox };
})();

// ---- ui/files.js ----
const __m_ui_files_js = (function () {
// 使用者觸發之另存／下載。以另存對話框帶入預設檔名為主；不支援時改用下載。
async function saveTextAs(suggestedName, text, mime = 'application/json') {
  const blob = new Blob([text], { type: mime + ';charset=utf-8' });
  return saveBlobAs(suggestedName, blob);
}

async function saveBlobAs(suggestedName, blob) {
  if (typeof window.showSaveFilePicker === 'function') {
    let fh;
    try {
      fh = await window.showSaveFilePicker({ suggestedName });
    } catch (e) {
      if (e && e.name === 'AbortError') return { saved: false, cancelled: true };
      throw e;
    }
    const w = await fh.createWritable();
    try {
      await w.write(blob);
      await w.close();
    } catch (e) {
      try { await w.abort(); } catch (e2) { /* 忽略 */ }
      throw e;
    }
    return { saved: true, name: fh.name, method: 'saveAs' };
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = suggestedName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  return { saved: true, name: suggestedName, method: 'download' };
}

return { saveTextAs, saveBlobAs };
})();

// ---- core/selfcheck.js ----
const __m_core_selfcheck_js = (function () {
// 啟動自檢（第4.3節）。env 為瀏覽器全域物件（測試時可傳假物件）。
function selfCheck(env) {
  const items = [];
  const add = (key, label, ok, effect, detail) => items.push({ key, label, ok: !!ok, effect, detail: detail || '' });
  const secure = !!env.isSecureContext;
  const crypto = env.crypto;
  const subtle = !!(crypto && crypto.subtle && typeof crypto.subtle.digest === 'function');
  const uuid = !!(crypto && typeof crypto.randomUUID === 'function');
  const fsAccess = typeof env.showDirectoryPicker === 'function';
  const saveAs = typeof env.showSaveFilePicker === 'function';
  const idb = !!env.indexedDB;
  const locks = !!(env.navigator && env.navigator.locks && typeof env.navigator.locks.request === 'function');
  const worker = typeof env.Worker === 'function';
  add('secure', '安全環境（isSecureContext）', secure, '停用編輯');
  add('subtle', 'crypto.subtle（SHA-256）', subtle, '停用編輯');
  add('uuid', 'crypto.randomUUID（主鍵）', uuid, '停用編輯');
  add('fsAccess', '檔案系統存取（showDirectoryPicker）', fsAccess, '唯讀模式：僅能開啟備份zip查詢及匯出');
  add('idb', 'IndexedDB（記住資料夾授權、當機復原草稿）', idb, '可編輯，但無當機復原');
  add('locks', 'navigator.locks（防止同瀏覽器兩分頁同時編輯）', locks, '可編輯，但請勿開兩分頁');
  add('saveAs', '另存對話框（showSaveFilePicker）', saveAs, '匯出改用瀏覽器下載，檔名可能無法帶入');
  add('worker', 'Web Worker', worker, '大量匯入時畫面可能停頓');
  const reasons = [];
  if (!secure) reasons.push('非安全環境');
  if (!subtle) reasons.push('無法計算SHA-256');
  if (!uuid) reasons.push('無法產生UUID');
  const canFolder = secure && subtle && uuid && fsAccess;
  if (!fsAccess) reasons.push('瀏覽器不支援檔案系統存取');
  return {
    items,
    caps: { secure, subtle, uuid, fsAccess, saveAs, idb, locks, worker },
    canEdit: canFolder,
    canFolder,
    readonlyReasons: reasons,
  };
}

return { selfCheck };
})();

// ---- core/errors.js ----
const __m_core_errors_js = (function () {
// 業務／協定錯誤：code 供程式判斷，message 為繁體中文說明（第11.2節）。
class SpecError extends Error {
  constructor(code, message, detail) {
    super(message);
    this.name = 'SpecError';
    this.code = code;
    this.detail = detail === undefined ? null : detail;
  }
}

function errText(e) {
  if (!e) return '未知錯誤';
  if (e instanceof SpecError) return e.message;
  return (e.name ? e.name + '：' : '') + (e.message || String(e));
}

return { SpecError, errText };
})();

// ---- core/util.js ----
const __m_core_util_js = (function () {
// 共用小工具：時間格式、雜湊、穩定序列化。不碰DOM。

function pad(n, w = 2) {
  return String(n).padStart(w, '0');
}

function isoUtc(ms) {
  return new Date(ms).toISOString();
}

// 20261018T024501Z（版本檔名用，UTC）
function compactUtc(ms) {
  const d = new Date(ms);
  return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + 'T' +
    pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + 'Z';
}

// Asia/Taipei 固定 UTC+8（台灣無日光節約時間）
function taipei(ms) {
  const d = new Date(ms + 8 * 3600 * 1000);
  return {
    y: d.getUTCFullYear(), mo: pad(d.getUTCMonth() + 1), d: pad(d.getUTCDate()),
    h: pad(d.getUTCHours()), mi: pad(d.getUTCMinutes()), s: pad(d.getUTCSeconds()),
  };
}

function taipeiDisplay(ms) {
  if (ms === null || ms === undefined || Number.isNaN(ms)) return '';
  const t = taipei(ms);
  return `${t.y}-${t.mo}-${t.d} ${t.h}:${t.mi}:${t.s}`;
}

function taipeiHM(ms) {
  const t = taipei(ms);
  return `${t.h}:${t.mi}`;
}

// 20261018-124805（匯出檔名用，第11.5節）
function taipeiCompact(ms) {
  const t = taipei(ms);
  return `${t.y}${t.mo}${t.d}-${t.h}${t.mi}${t.s}`;
}

function parseIso(s) {
  const v = Date.parse(s);
  return Number.isNaN(v) ? null : v;
}

function hex(buf) {
  const b = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
  let s = '';
  for (let i = 0; i < b.length; i++) s += (b[i] < 16 ? '0' : '') + b[i].toString(16);
  return s;
}

function fromHex(s) {
  const out = new Uint8Array(s.length / 2);
  for (let i = 0; i < out.length; i++) out[i] = parseInt(s.substr(i * 2, 2), 16);
  return out;
}

function utf8(text) {
  return new TextEncoder().encode(text);
}

async function sha256Bytes(bytes) {
  return hex(await globalThis.crypto.subtle.digest('SHA-256', bytes));
}

async function sha256Text(text) {
  return sha256Bytes(utf8(text));
}

function newId() {
  return globalThis.crypto.randomUUID();
}

function randomHex(nBytes) {
  const b = new Uint8Array(nBytes);
  globalThis.crypto.getRandomValues(b);
  return hex(b);
}

// 鍵排序之JSON，供雜湊鏈計算
function stableStringify(v) {
  if (v === null || typeof v !== 'object') return JSON.stringify(v === undefined ? null : v);
  if (Array.isArray(v)) return '[' + v.map(stableStringify).join(',') + ']';
  const keys = Object.keys(v).filter((k) => v[k] !== undefined).sort();
  return '{' + keys.map((k) => JSON.stringify(k) + ':' + stableStringify(v[k])).join(',') + '}';
}

function deepClone(v) {
  return v === undefined ? undefined : JSON.parse(JSON.stringify(v));
}

function revLabel(rev) {
  return 'r' + pad(rev, 6);
}

return { pad, isoUtc, compactUtc, taipeiDisplay, taipeiHM, taipeiCompact, parseIso, hex, fromHex, utf8, sha256Bytes, sha256Text, newId, randomHex, stableStringify, deepClone, revLabel };
})();

// ---- core/paths.js ----
const __m_core_paths_js = (function () {
// 資料夾結構（第4.4節）。所有檔名由程式產生並以白名單驗證；不以使用者輸入組成路徑。
const { SpecError } = __m_core_errors_js;
const { pad, compactUtc } = __m_core_util_js;
const P = {
  META: 'specdrug.json',
  TOKEN: 'control/editing.json',
  KEYWORD: 'control/keyword.json',
  CURRENT: 'data/current.json',
  VERSIONS: 'data/versions',
  EXPORT_LOG: 'logs/export-log.jsonl',
};

const FILE_PATTERNS = [
  /^specdrug\.json$/,
  /^control\/editing\.json$/,
  /^control\/keyword\.json$/,
  /^control\/_writetest-[0-9a-f-]{36}\.tmp$/,
  /^data\/current\.json$/,
  /^data\/versions\/r\d{6}-\d{8}T\d{6}Z-[0-9a-f]{8}\.json$/,
  /^masters\/[0-9a-f-]{36}\.json$/,
  /^attachments\/[0-9a-f]{2}\/[0-9a-f]{64}$/,
  /^logs\/export-log\.jsonl$/,
];

const DIR_PATTERNS = [/^$/, /^control$/, /^data$/, /^data\/versions$/, /^masters$/, /^attachments$/, /^attachments\/[0-9a-f]{2}$/, /^backups$/, /^logs$/];

function isValidPath(p) {
  return typeof p === 'string' && FILE_PATTERNS.some((re) => re.test(p));
}

function assertPath(p) {
  if (!isValidPath(p)) throw new SpecError('BAD_PATH', `不允許的檔案路徑：${p}`);
  return p;
}

function assertDir(d) {
  if (typeof d !== 'string' || !DIR_PATTERNS.some((re) => re.test(d))) {
    throw new SpecError('BAD_PATH', `不允許的資料夾路徑：${d}`);
  }
  return d;
}

function versionFileName(revision, ms, sha256) {
  return `r${pad(revision, 6)}-${compactUtc(ms)}-${sha256.slice(0, 8)}.json`;
}

const VERSION_RE = /^r(\d{6})-(\d{8}T\d{6}Z)-([0-9a-f]{8})\.json$/;

function parseVersionFileName(name) {
  const m = VERSION_RE.exec(name);
  if (!m) return null;
  return { name, revision: Number(m[1]), stamp: m[2], sha8: m[3] };
}

function attachmentPath(sha256) {
  if (!/^[0-9a-f]{64}$/.test(sha256)) throw new SpecError('BAD_PATH', '附件雜湊格式錯誤');
  return `attachments/${sha256.slice(0, 2)}/${sha256}`;
}

function masterPath(importId) {
  return assertPath(`masters/${importId}.json`);
}

return { P, isValidPath, assertPath, assertDir, versionFileName, parseVersionFileName, attachmentPath, masterPath };
})();

// ---- core/dataset.js ----
const __m_core_dataset_js = (function () {
// 業務資料集合（第6.2節）與設定。階段1只建立空集合；各集合欄位於後續階段補齊。
const { SpecError } = __m_core_errors_js;
const COLLECTIONS = [
  'case_record', 'case_drug', 'recognition', 'recognition_revision', 'meeting', 'meeting_agenda',
  'decision', 'decision_drug', 'revision_decision', 'master_import', 'scope_snapshot', 'scope_member',
  'group_treatment', 'contract', 'contract_drug', 'price_action', 'annotation_event', 'attachment',
  'attachment_link', 'op_log', 'review_item', 'migration_batch', 'migration_row',
];

// Q13：預設值，可於設定調整
const DEFAULT_SETTINGS = {
  heartbeat_sec: 30,
  stale_min: 5,
  keyword_max_fail: 5,
  keyword_lock_sec: 30,
  csv_header_notes: true,
  attachment_max_mb: 50,
};

const SETTING_RULES = {
  heartbeat_sec: { type: 'int', min: 5, max: 300, label: '心跳間隔（秒）' },
  stale_min: { type: 'int', min: 1, max: 120, label: '視為已關閉（分鐘）' },
  keyword_max_fail: { type: 'int', min: 1, max: 20, label: '關鍵詞連續輸錯次數' },
  keyword_lock_sec: { type: 'int', min: 5, max: 3600, label: '輸錯鎖定（秒）' },
  csv_header_notes: { type: 'bool', label: 'CSV加說明列' },
  attachment_max_mb: { type: 'int', min: 1, max: 500, label: '附件大小上限（MB）' },
};

function settingLabel(key) {
  return SETTING_RULES[key] ? SETTING_RULES[key].label : key;
}

function emptyData() {
  const collections = {};
  for (const name of COLLECTIONS) collections[name] = [];
  return { collections, settings: { ...DEFAULT_SETTINGS } };
}

function effectiveSettings(data) {
  return { ...DEFAULT_SETTINGS, ...((data && data.settings) || {}) };
}

// 欄位白名單＋值域檢查；回傳 {next, diff}
function validateSettingsPatch(current, patch) {
  const next = { ...DEFAULT_SETTINGS, ...current };
  const diff = {};
  for (const [k, raw] of Object.entries(patch)) {
    const rule = SETTING_RULES[k];
    if (!rule) throw new SpecError('FIELD_NOT_ALLOWED', `設定不允許修改欄位：${k}`);
    let v;
    if (rule.type === 'int') {
      v = typeof raw === 'number' ? raw : Number(String(raw).trim());
      if (!Number.isInteger(v) || v < rule.min || v > rule.max) {
        throw new SpecError('BAD_VALUE', `${rule.label}須為 ${rule.min}～${rule.max} 的整數`);
      }
    } else {
      if (typeof raw !== 'boolean') throw new SpecError('BAD_VALUE', `${rule.label}須為是／否`);
      v = raw;
    }
    if (next[k] !== v) {
      diff[k] = { from: next[k], to: v };
      next[k] = v;
    }
  }
  if (next.stale_min * 60 < next.heartbeat_sec * 3) {
    throw new SpecError('BAD_VALUE', '「視為已關閉」時間須至少為心跳間隔的3倍');
  }
  return { next, diff };
}

return { COLLECTIONS, DEFAULT_SETTINGS, settingLabel, emptyData, effectiveSettings, validateSettingsPatch };
})();

// ---- core/audit.js ----
const __m_core_audit_js = (function () {
// 稽核紀錄：只追加；每筆含前一筆雜湊（第11.4節第5點）。
const { sha256Text, stableStringify } = __m_core_util_js;
const GENESIS_HASH = '0'.repeat(64);

async function hashEvent(ev) {
  const rest = { ...ev };
  delete rest.hash;
  return sha256Text(stableStringify(rest));
}

// drafts：尚未封存的事件；接在 prev 之後計算 seq、prev_hash、hash
async function sealEvents(prev, drafts) {
  const out = prev.slice();
  let last = prev.length ? prev[prev.length - 1].hash : GENESIS_HASH;
  for (const d of drafts) {
    const ev = { ...d, seq: out.length + 1, prev_hash: last };
    delete ev.hash;
    ev.hash = await hashEvent(ev);
    last = ev.hash;
    out.push(ev);
  }
  return out;
}

async function verifyChain(events) {
  if (!Array.isArray(events)) return { ok: false, index: -1, reason: '稽核紀錄格式錯誤' };
  let last = GENESIS_HASH;
  for (let i = 0; i < events.length; i++) {
    const ev = events[i];
    if (!ev || ev.seq !== i + 1) {
      return { ok: false, index: i, seq: ev && ev.seq, reason: `第 ${i + 1} 筆序號不連續（記載 ${ev && ev.seq}）` };

    const r = await fs.read(`${P.VERSIONS}/${item.name}`);

    row.size = r.size;

      const f = JSON.parse(r.text);
      row.header = f.header;
      const chain = await verifyChain(f.audit);
      if (!chain.ok) row.notes.push('稽核雜湊鏈中斷：' + chain.reason);
    } catch (e) {
      row.notes.push('JSON格式錯誤');
    }

    if (row.isCurrent && current.sha256 !== row.sha256) row.notes.push('與current.json記載雜湊不符');
    row.ok = row.notes.length === 0;
    if (!byRev.has(item.revision)) byRev.set(item.revision, []);
    byRev.get(item.revision).push(row);
    out.push(row);
  }

    if (!row.header || row.header.prev_revision === null || row.header.prev_revision === undefined) continue;
    const prevs = byRev.get(row.header.prev_revision) || [];
    const linked = prevs.find((p) => p.sha256 === row.header.prev_sha256);

    referenced.add(current.file);
    let cur = out.find((r) => r.name === current.file);
    while (cur && cur.header && cur.header.prev_sha256) {

      cur = prev;

//   TOKEN_LOST：編輯牌已不在本工作階段；CONFLICT：資料夾已被其他分頁或程式變更；

  // 重試：若 current.json 的 save_id 已是本次，視為已完成
  const cur0 = await readCurrent(fs);
  if (cur0.save_id === saveId) {
    return { status: 'already', current: cur0, name: cur0.file };
  }
  // 步驟1：編輯牌仍為本工作階段持有；revision 與開啟時相同
  const tr = await fs.read(P.TOKEN);
  let tok = null;
  try { tok = tr ? JSON.parse(tr.text) : null; } catch (e) { tok = null; }
  if (!tok || tok.state !== 'held' || tok.session_id !== session.id) {
    throw new SpecError('TOKEN_LOST', '編輯牌已不在本工作階段（可能已被強制收回或逾時由他人取得），拒絕儲存；未儲存變更已保留為復原草稿', { token: tok });
  }
  if (cur0.revision !== base.revision || cur0.sha256 !== base.sha256) {
    throw new SpecError('CONFLICT', '資料夾已被其他分頁或程式變更，請重新載入核對', { current: cur0 });
  }
  // 步驟2：引用檔案；稽核雜湊鏈連續
  await verifyRefs(fs, refs);
  const now = clock.now();
  const audit = await sealEvents(auditBase, auditDrafts.map((d) => ({ ...d, app_version: APP_VERSION })));
  if (!isPrefixOf(auditBase, audit)) throw new SpecError('AUDIT_CHAIN', '稽核紀錄不連續，拒絕儲存');
  const chain = await verifyChain(audit);
  if (!chain.ok) throw new SpecError('AUDIT_CHAIN', '稽核雜湊鏈驗證失敗：' + chain.reason);
  // 步驟3：寫入新版本檔並讀回比對
  const revision = base.revision + 1;
  const v = await writeVersionFile(fs, {
    folderId: meta.folder_id, revision, prev: base, now, session, saveId, data, audit, summary,
  });
  // 步驟4：寫入新 current.json
  const rec = currentRecord({ revision, ...v });
  await fs.write(P.CURRENT, json(rec));
  // 步驟5：重讀 current.json，save_id 須為本次
  const cur1 = await readCurrent(fs);
  if (cur1.save_id !== saveId) {
    throw new SpecError('OVERWRITTEN', `目前版本已被其他人覆蓋。本次版本檔：${v.name}（可由儲存歷程找回）`, { name: v.name, current: cur1 });

const STORE = 'kv';

        const v2 = await dialog('已另存', [h('p', { text: `已存為「${r.name}」。要刪除本機草稿嗎？` })], [
          { label: '保留', value: null }, { label: '刪除本機草稿', value: 'del', primary: true },
        ]);
        if (v2 === 'del') await s.discardDraft();
      }
    }
    if (v === 'discard') {
      const ok = await dialog('確認放棄', [h('p', { text: '放棄後無法取回此草稿。確定放棄？' })], [{ label: '取消', value: null }, { label: '放棄', value: true, primary: true }]);
      if (ok) await s.discardDraft();
    }
  }
}

// ---------- 編輯牌 ----------
async function explainStartFail(r) {
  const s = ui.session;
  if (r.status === 'held' || r.status === 'checking') {
    const t = r.token;
    const last = r.lastSeen ? taipeiHM(r.lastSeen) : '確認中';
    const v = await dialog('編輯牌在他人手上', [
      h('p', { text: `編輯牌目前在 ${(t.holder && t.holder.user) || '（不明）'}（電腦：${(t.holder && t.holder.pc) || '不明'}）手上，自 ${taipeiHM(parseIso(t.acquired_at))} 起，最後回應 ${last}。` }),
      r.status === 'checking' ? h('p', { class: 'warn-text', text: '檔案時間與本機時間差異異常，正以心跳序號觀察判定（確認中）。' }) : null,
      h('p', { text: '請待對方結束編輯，或使用「強制收回」。' }),
    ], [
      { label: '繼續查詢', value: null },
      { label: '重新檢查', value: 'retry' },
      { label: '強制收回', value: 'force', primary: true },
    ]);
    if (v === 'retry') { const r2 = await s.startEdit(); if (!r2.ok) await explainStartFail(r2); else await afterAcquire(r2); }
    if (v === 'force') await doForce();
    return;
  }
  const map = {
    blocked: ['只能查詢', ...(r.reasons || [])],
    tab_locked: ['只能查詢', '此資料夾已在同一瀏覽器的另一分頁編輯中。請回到該分頁，或先關閉該分頁。'],
    stale_view: ['資料夾有新版', '資料夾已有新版本，請先按「重新載入」再開始編輯。'],
    race: ['取牌未成功', `幾乎同時有人取牌，目前持牌：${who(r.token && r.token.holder)}。已退回查詢模式。`],
    error: ['取牌失敗', r.error || ''],
  };
  const m = map[r.status] || ['無法開始編輯', r.status];
  await alertBox(m[0], ...m.slice(1));
}

async function afterAcquire(r) {
  if (r.status === 'took_local' && r.previous) {
    await alertBox('已取得編輯牌', `前一位持牌者為本瀏覽器先前的分頁（${who(r.previous.holder)}，最後回應 ${fmtIso(r.previous.heartbeat_at)}），該分頁已關閉，視同已歸還。`);
  }
  if (r.status === 'took_stale' && r.previous) {
    await alertBox('已取得編輯牌', `前一位持牌者 ${who(r.previous.holder)} 最後回應 ${fmtIso(r.previous.heartbeat_at)}，已超過 ${ui.session.settings.stale_min} 分鐘無回應，視為已關閉。`);
  }
  if (await ui.session.keywordMissing()) {
    const kw = await askNewKeyword('關鍵詞檔不存在，請重新設定');
    if (kw) await ui.session.resetMissingKeyword(kw);
  }
  startTimers();
  if (!ui.session.hasUnsaved || (ui.session.dirty === 0)) {
    const rc = await ui.session.recoveryCheck();
    if (rc.kind === 'same_base' && !ui.recovering) {
      const v = await dialog('復原草稿', [h('p', { text: `本機有復原草稿（${fmtIso(rc.draft.saved_at)}，未儲存變更 ${rc.draft.dirty} 項），基準與目前版本相同。` })], [
        { label: '稍後再說', value: null }, { label: '放棄草稿', value: 'discard' }, { label: '復原', value: 'apply', primary: true },
      ]);
      if (v === 'apply') await ui.session.applyDraft();
      if (v === 'discard') await ui.session.discardDraft();
    }
  }
}

async function doStartEdit() {
  const r = await ui.session.startEdit();
  if (!r.ok) { await explainStartFail(r); return; }
  await afterAcquire(r);
}

async function doEndEdit() {
  const s = ui.session;
  let choice;
  if (s.dirty > 0) {
    choice = await dialog('結束編輯', [h('p', { text: `有 ${s.dirty} 項未儲存變更。` })], [
      { label: '取消', value: null },
      { label: '放棄變更', value: 'discard' },
      { label: '保留本機草稿', value: 'draft' },
      { label: '儲存', value: 'save', primary: true },
    ]);
    if (!choice) return;
  }
  const r = await s.endEdit(choice);
  if (r.releaseError) await alertBox('還牌未完成', `編輯牌改寫失敗：${r.releaseError}。他人須待 ${s.settings.stale_min} 分鐘無心跳後才能取牌。`);
}

async function doSave() {
  const s = ui.session;
  try {
    const r = await s.save();
    if (r.status === 'already') await alertBox('已儲存', '先前一次儲存已完成（依 save_id 判定），未重複建立版本。');
  } catch (e) {
    if (e.code === 'OVERWRITTEN') { await alertBox('目前版本已被其他人覆蓋', e.message, '本次變更仍保留於復原草稿。'); return; }
    if (e.code === 'CONFLICT') { await alertBox('儲存被拒', e.message, '你的變更已保留於本機復原草稿。請結束編輯（保留草稿）→重新載入→核對後重套。'); return; }
    if (e.code === 'TOKEN_LOST') { await alertBox('儲存被拒', e.message); return; }
    throw e;
  }
}

async function doForce() {
  const s = ui.session;
  const st = s.guard.status();
  if (st.locked) { await alertBox('暫停嘗試', `連續輸錯，請 ${Math.ceil(st.remainMs / 1000)} 秒後再試。`); return; }
  const kw = h('input', { type: 'password', autocomplete: 'off' });
  const reason = h('input', { type: 'text', size: 30 });
  const msg = h('p', { class: 'warn-text', role: 'alert' });
  const holder = s.tokenStatus && s.tokenStatus.token && s.tokenStatus.token.holder;
  const v = await dialog('強制收回編輯牌', [
    h('p', { text: `目前持牌：${who(holder)}。收回後對方將於下次心跳（約${s.settings.heartbeat_sec}秒內）改為查詢模式，其未儲存變更保留於對方電腦的復原草稿。` }),
    h('label', null, '關鍵詞 ', kw), h('br'), h('label', null, '收回原因 ', reason), msg,
  ], [
    { label: '取消', value: null },
    { label: '強制收回', value: 'go', primary: true, validate: () => {
      if (!reason.value.trim()) { msg.textContent = '請填收回原因'; return false; }
      return true;
    } },
  ]);
  if (!v) return;
  const r = await s.forceTakeover(kw.value, reason.value);
  if (r.ok) { await alertBox('已收回', '已取得編輯牌。收回紀錄將於下次存檔（或結束編輯時）寫入稽核。'); await afterAcquire(r); return; }
  const map = {
    wrong: `關鍵詞不正確，未收回。再錯 ${r.remaining} 次將暫停30秒。`,
    locked: `連續輸錯，請 ${Math.ceil((r.remainMs || 0) / 1000)} 秒後再試。`,
    no_keyword: '尚未設定關鍵詞（control/keyword.json 不存在），無法強制收回。請待持牌者結束編輯或逾時；取牌後可重新設定。',
    need_reason: '請填收回原因。',
    blocked: '只能查詢：' + (r.reasons || []).join('；'),
    tab_locked: '此資料夾已在同一瀏覽器的另一分頁編輯中。',
    stale_view: '資料夾有新版，請先重新載入。',
    race: '收回時有人同時取牌，未成功。',
  };
  await alertBox('未收回', map[r.status] || r.status);
}

async function doReload() {
  const s = ui.session;
  if (s.mode === 'edit' && s.hasUnsaved) { await alertBox('有未儲存變更', '請先儲存或結束編輯（保留草稿）後再重新載入。'); return; }
  await s.reload();
  startTimers();
}

// ---------- 畫面 ----------
function renderStatusBar() {
  const s = ui.session;
  const bar = h('div', { class: 'statusbar', role: 'status' });
  if (!s || s.mode === 'closed') {
    bar.appendChild(h('span', { text: '尚未開啟資料夾' }));
    return bar;
  }
  const st = s.statusInfo();
  const modeText = st.mode === 'edit' ? '編輯中' : st.mode === 'query' ? '查詢' : '無法開啟';
  bar.appendChild(h('span', { class: 'chip' + (st.mode === 'edit' ? ' chip-edit' : ''), text: `模式：${modeText}` }));
  bar.appendChild(h('span', { text: `資料夾：${ui.folderName}` }));
  const t = st.token;
  let tokText = '編輯牌：狀態不明';
  if (t) {
    if (t.status === 'free') tokText = '編輯牌：無人持有';
    else if (t.status === 'mine') tokText = `編輯牌：本分頁持有（自 ${taipeiHM(parseIso(t.token.acquired_at))}）`;
    else if (t.status === 'held') tokText = `編輯牌：${who(t.token.holder)}持有（自 ${taipeiHM(parseIso(t.token.acquired_at))}，最後回應 ${taipeiHM(t.lastSeen)}）`;
    else if (t.status === 'checking') tokText = `編輯牌：${who(t.token.holder)}持有（確認中）`;
    else if (t.status === 'stale') tokText = `編輯牌：${who(t.token.holder)}已逾時無回應（可取牌）`;
  }
  if (st.tokenUncertain) tokText = '編輯牌狀態不明（心跳寫入失敗，暫停存檔）';
  bar.appendChild(h('span', { class: st.tokenUncertain ? 'warn-text' : '', text: tokText }));
  if (st.revision !== undefined && st.revision !== null) bar.appendChild(h('span', { text: `${revLabel(st.revision)}｜${fmtIso(st.savedAt)}` }));
  bar.appendChild(h('span', { class: st.unsaved ? 'warn-text' : '', text: `未儲存變更：${st.unsaved}${st.pendingAudit && !st.unsaved ? `（待寫入稽核 ${st.pendingAudit} 筆）` : ''}` }));
  bar.appendChild(h('span', { text: '主檔：尚未匯入' }));
  if (st.newerAvailable) bar.appendChild(h('span', { class: 'chip chip-warn', text: '資料夾有新版，請重新載入' }));
  return bar;
}

function renderToolbar() {
  const s = ui.session;
  const bar = h('div', { class: 'toolbar' });
  if (!s || (s.mode !== 'query' && s.mode !== 'edit')) return bar;
  if (s.mode === 'query') {
    const blockers = s.editBlockers();
    bar.appendChild(btn('開始編輯', () => guard(doStartEdit), { primary: true, disabled: blockers.length > 0, title: blockers.join('；') }));
    const t = s.tokenStatus;
    if (t && (t.status === 'held' || t.status === 'checking')) bar.appendChild(btn('強制收回', () => guard(doForce), { disabled: blockers.length > 0 }));
    bar.appendChild(btn('重新載入', () => guard(doReload)));
  } else {
    bar.appendChild(btn('儲存', () => guard(doSave), { primary: true, disabled: !s.hasUnsaved || s.tokenUncertain }));
    bar.appendChild(btn('結束編輯', () => guard(doEndEdit)));
  }
  bar.appendChild(btn('關閉資料夾', () => guard(closeFolder)));
  return bar;
}

async function closeFolder() {
  const s = ui.session;
  if (s && s.mode === 'edit') {
    await doEndEdit();
    if (s.mode === 'edit') return;
  }
  stopTimers();
  ui.session = null;
  ui.folderName = '';
}

function renderSettings() {

  });

      const nk = await askNewKeyword('輸入新關鍵詞');

}

        ['瀏覽器', navigator.userAgent],
      ]),
      h('p', { class: 'note', text: '編輯牌是程式之間的約定，不是檔案伺服器仲裁的獨占鎖；關鍵詞用來防止誤按與隨意搶牌，不是資安控管（第4.6節第15、16點）。' })),
    h('section', { class: 'panel' }, h('h2', { text: '啟動自檢' }), renderSelfCheck()),
  ];
}

function render() {
  const root = $root();
  clear(root);
  root.appendChild(h('header', { class: 'top' },
    h('h1', { text: '特殊藥品認定、調高及供貨合約管理系統' }),
    h('span', { class: 'ver', text: `v${APP_VERSION}｜資料結構 ${SCHEMA_VERSION}` })));
  root.appendChild(renderStatusBar());
  const s = ui.session;
  if (!s) {
    root.appendChild(h('main', null, renderStart()));
    return;
  }
  root.appendChild(renderToolbar());
  if (s.mode === 'error') {
    root.appendChild(h('main', null, renderError(), h('div', { class: 'toolbar' }, btn('關閉資料夾', () => guard(closeFolder)))));
    return;
  }
  root.appendChild(renderTabs());
  const views = { home: renderHome, history: renderHistory, settings: renderSettings, about: renderAbout };
  root.appendChild(h('main', null, (views[ui.tab] || renderHome)()));
}

function boot() {
  ui.check = selfCheck(window);
  window.addEventListener('beforeunload', (e) => {
    if (ui.session && ui.session.hasUnsaved) { e.preventDefault(); e.returnValue = ''; }
  });
  window.addEventListener('pagehide', () => {
    if (ui.session) ui.session.closing();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && ui.session) onPoll();
  });
  render();
}

boot();

return {  };
})();

</script>
</body>
</html>

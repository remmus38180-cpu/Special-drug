const DATE_LABEL = { signed_date: '簽訂日', effective_from: '生效日', expiry_date: '到期日', effective_to: '迄日', effective_date: '生效日', announce_date: '公告日期' };
function dates(obj) {
  for (const k of Object.keys(DATE_LABEL)) if (k in obj) obj[k] = dateField(obj[k], DATE_LABEL[k]);
  return obj;
}

function addDays(iso, n) {
  const [y, m, d] = iso.split('-').map(Number);
  const t = new Date(Date.UTC(y, m - 1, d + n));
  return `${t.getUTCFullYear()}-${String(t.getUTCMonth() + 1).padStart(2, '0')}-${String(t.getUTCDate()).padStart(2, '0')}`;
}

// ================= 合約 =================
const CONTRACT_EDIT = ['contract_no', 'firm', 'signed_date', 'effective_from', 'expiry_date', 'doc_version', 'obligations', 'status'];

function checkSigned(rec) {
  if (rec.status === '完成簽署' && !rec.signed_date) throw new SpecError('REQUIRED', '合約「完成簽署」須填簽訂日');
}

// original_contract_id：補充協議／新版合約指向原合約，原件保留（T15）
function createContract(data, ctx, input) {
  const { drugs = [], original_contract_id, ...rest } = input || {};
  const v = dates(pick(rest, CONTRACT_EDIT));
  if (!txt(v.contract_no)) throw new SpecError('REQUIRED', '請輸入合約編號');
  v.contract_no = txt(v.contract_no);
  checkSigned({ status: v.status || '辦理中', signed_date: v.signed_date });
  if (original_contract_id) must(data, 'contract', original_contract_id);
  const rec = insert(data, ctx, 'contract', { ...v, original_contract_id: original_contract_id || null });
  for (const d of drugs) {
    if (typeof d === 'string') addContractDrug(data, ctx, rec.id, d);
    else addContractDrug(data, ctx, rec.id, d.drug_code, d);
  }
  return rec;
}

function addContractDrug(data, ctx, contractId, drugCode, { effective_from, effective_to } = {}) {
  must(data, 'contract', contractId);
  const c = code(drugCode);
  if (list(data, 'contract_drug').some((r) => r.contract_id === contractId && r.drug_code === c)) {
    throw new SpecError('DUPLICATE', `合約已含品項 ${c}`);
  }
  return insert(data, ctx, 'contract_drug', dates({ contract_id: contractId, drug_code: c, effective_from, effective_to }));
}

// 已確認調高引用之合約（Q11 暫採：可改，但列出受影響調高並須填原因）
function contractAffected(data, contractId) {
  return list(data, 'price_action').filter((p) => p.contract_id === contractId && p.confirm_status === '已確認');
}

function updateContract(data, ctx, id, changes, { expectedVersion, reason } = {}) {
  const v = dates(pick(changes, CONTRACT_EDIT));
  if ('contract_no' in v && !txt(v.contract_no)) throw new SpecError('REQUIRED', '請輸入合約編號');
  const cur = must(data, 'contract', id);
  checkSigned({ ...cur, ...v });
  const affected = contractAffected(data, id);
  if (affected.length && !txt(reason)) {
    throw new SpecError('NEED_REASON', `此合約已被 ${affected.length} 筆已確認調高引用（${affected.map((p) => p.drug_code).join('、')}），修改須填原因`, { affected: affected.map((p) => p.id) });
  }
  const r = txt(reason) ? (affected.length ? `${txt(reason)}（受影響調高：${affected.map((p) => p.drug_code).join('、')}）` : txt(reason)) : null;
  return update(data, ctx, 'contract', id, v, { expectedVersion, reason: r });
}

function contractDrugs(data, contractId) {
  return list(data, 'contract_drug').filter((r) => r.contract_id === contractId).sort((a, b) => (a.drug_code < b.drug_code ? -1 : 1));
}

// 原合約及其後續補充協議／版本（T15）
function contractChain(data, contractId) {
  let root = must(data, 'contract', contractId);
  const seen = new Set();
  while (root.original_contract_id && !seen.has(root.id)) { seen.add(root.id); root = must(data, 'contract', root.original_contract_id); }
  const out = [];
  const queue = [root];
  while (queue.length) {
    const c = queue.shift();
    const atts = list(data, 'attachment_link').filter((l) => l.entity === 'contract' && l.entity_id === c.id)
      .map((l) => find(data, 'attachment', l.attachment_id)).filter(Boolean).sort((a, b) => a.version - b.version);
    out.push({ ...c, drugs: contractDrugs(data, c.id), attachments: atts });
    queue.push(...list(data, 'contract').filter((x) => x.original_contract_id === c.id).sort((a, b) => (a.created_at < b.created_at ? -1 : 1)));
  }
  return out;
}

// 到期提醒：只提醒檢視，不自動取消認定、註記或價格（T20、B11）；無到期日不猜測
function contractAlerts(data, day, withinDays = 60) {
  const limit = addDays(day, withinDays);
  return list(data, 'contract').filter((c) => c.status === '完成簽署' && c.expiry_date && c.expiry_date <= limit)
    .map((c) => ({ ...c, alert: c.expiry_date <= day ? '已到期' : '即將到期' }))
    .sort((a, b) => (a.expiry_date < b.expiry_date ? -1 : 1));
}

function contractExpiryText(c, day) {
  if (!c.expiry_date) return '無到期日（不推定）';
  return c.expiry_date <= day ? '已到期' : '未到期';
}

function listContracts(data, { keyword, drugCode } = {}) {
  const kw = txt(keyword);
  const dc = txt(drugCode);
  return list(data, 'contract').filter((c) => {
    if (dc && !contractDrugs(data, c.id).some((d) => d.drug_code === dc)) return false;
    if (!kw) return true;
    return [c.contract_no, c.firm, c.obligations, c.doc_version].some((x) => x && String(x).includes(kw)) ||
      contractDrugs(data, c.id).some((d) => d.drug_code.includes(kw));
  }).sort((a, b) => (a.contract_no < b.contract_no ? -1 : 1));
}

// ================= 調高 =================
// 一般修改白名單（M3）：確認狀態、確認者、revision_id、drug_code、snapshot_id、supersedes_id、建立者皆不可經此改
const PA_EDIT = ['case_id', 'contract_requirement', 'requirement_basis', 'contract_id', 'price_before', 'price_after',
  'effective_date', 'announce_doc_no', 'announce_date', 'status', 'note'];

function snapshotOfCode(data, revId, drugCode) {
  const rev = must(data, 'recognition_revision', revId);
  const snaps = list(data, 'scope_snapshot').filter((s) => s.revision_id === revId && s.status === '已確認' && s.rule && rev.rule && canonical(s.rule) === canonical(rev.rule))
    .sort((a, b) => (a.confirmed_at < b.confirmed_at ? 1 : -1));
  for (const s of snaps) if (snapshotFinal(data, s.id).some((m) => m.drug_code === drugCode)) return s.id;
  return null;
}

function checkCaseBasis(data, caseId, drugCode) {
  if (!caseId) return;
  must(data, 'case_record', caseId);
  const inCase = list(data, 'case_drug').some((d) => d.case_id === caseId && d.drug_code === drugCode);
  if (inCase && !drugFollowupBasis(data, caseId, drugCode).length) {
    throw new SpecError('NO_BASIS', `${drugCode} 在此案件沒有「同意／附條件同意」的會議決議，不能接續調高`);
  }
}

function moneyFields(v) {
  if ('price_before' in v) v.price_before = money(v.price_before, '調高前價格');
  if ('price_after' in v) v.price_after = money(v.price_after, '調高後價格');
  return v;
}

// 從範圍名單勾選建立調高紀錄；範圍外品項不可直接勾入（§9.2-6、T08）
function createPriceAction(data, ctx, input) {
  const { revision_id, drug_code, supersedes_id, ...rest } = input || {};
  const rev = must(data, 'recognition_revision', revision_id);
  if (rev.confirm_status === '撤銷') throw new SpecError('REVOKED', '認定版本已撤銷');
  if (rev.category === '取消認定') throw new SpecError('BAD_CATEGORY', '取消認定版本不可建立調高紀錄');
  const c = code(drug_code);
  if (!revisionScope(data, revision_id).has(c)) {
    throw new SpecError('OUT_OF_SCOPE', `${c} 不在此認定已確認的範圍名單內；範圍外品項不可直接勾入，須另補認定依據`);
  }
  const v = moneyFields(dates(pick(rest, PA_EDIT)));
  checkCaseBasis(data, v.case_id, c);
  if (v.contract_id) must(data, 'contract', v.contract_id);
  if (supersedes_id) {
    const old = must(data, 'price_action', supersedes_id);
    if (old.confirm_status !== '已確認') throw new SpecError('BAD_SUPERSEDE', '只能更正已確認之調高紀錄；未確認者請直接修改');
    if (old.drug_code !== c || old.revision_id !== revision_id) throw new SpecError('BAD_SUPERSEDE', '更正紀錄須與原紀錄同品項、同認定版本');
    if (list(data, 'price_action').some((p) => p.supersedes_id === supersedes_id && p.confirm_status !== '撤銷')) {
      throw new SpecError('DUPLICATE', '此調高紀錄已有更正紀錄');
    }
  }
  return insert(data, ctx, 'price_action', {
    ...v, revision_id, drug_code: c, snapshot_id: snapshotOfCode(data, revision_id, c), supersedes_id: supersedes_id || null,
  }, { action: supersedes_id ? '新增（更正）' : '新增' });
}

function createPriceActions(data, ctx, revisionId, codes, common = {}) {
  const uniq = [...new Set(codes)];
  if (!uniq.length) throw new SpecError('REQUIRED', '請勾選本次調高品項');
  return uniq.map((c) => createPriceAction(data, ctx, { ...common, revision_id: revisionId, drug_code: c }));
}

function updatePriceAction(data, ctx, id, changes, { expectedVersion } = {}) {
  const v = moneyFields(dates(pick(changes, PA_EDIT)));
  const pa = must(data, 'price_action', id);
  if ('case_id' in v) checkCaseBasis(data, v.case_id, pa.drug_code);
  if (v.contract_id) must(data, 'contract', v.contract_id);
  return update(data, ctx, 'price_action', id, v, { expectedVersion });
}

function submitPriceAction(data, ctx, id) {
  return setConfirmStatus(data, ctx, 'price_action', id, '待確認');
}

function withdrawPriceAction(data, ctx, id, reason) {
  const pa = must(data, 'price_action', id);
  if (pa.confirm_status === '已確認') throw new SpecError('CONFIRMED_READONLY', '已確認之調高紀錄不可撤銷；請新增更正紀錄');
  for (const a of list(data, 'annotation_event')) {
    if (a.price_action_id === id && (a.confirm_status === '草稿' || a.confirm_status === '待確認')) {
      setConfirmStatus(data, ctx, 'annotation_event', a.id, '撤銷', { reason: `連結之調高紀錄撤銷：${txt(reason) || ''}` });
    }
  }
  return setConfirmStatus(data, ctx, 'price_action', id, '撤銷', { reason });
}

// 合約涵蓋：完成簽署且合約品項含此代碼；不檢查合約及品項起訖是否涵蓋調高生效日（B18）
function contractCovers(data, contractId, drugCode) {
  return list(data, 'contract_drug').some((r) => r.contract_id === contractId && r.drug_code === drugCode);
}

// 逐項驗證錯誤；空陣列代表可確認
function validatePriceAction(data, pa) {
  const errs = [];
  const rev = find(data, 'recognition_revision', pa.revision_id);
  if (!rev || rev.confirm_status !== '已確認') errs.push('認定版本尚未確認');
  else if (!revisionScope(data, pa.revision_id).has(pa.drug_code)) errs.push('品項不在已確認範圍名單內');
  if (pa.status !== '已核定') errs.push('辦理狀態尚非「已核定」（請於核定後補正式文號、日期）');
  if (!pa.announce_doc_no || !pa.announce_date) errs.push('缺正式公告文號或日期');
  if (!pa.effective_date) errs.push('缺調高生效日');
  if (pa.price_after === null || pa.price_after === undefined) errs.push('缺調高後價格');
  if (pa.contract_requirement === '須簽約') {
    if (!pa.contract_id) errs.push('須簽約但未對應合約（缺件）');
    else {
      const c = find(data, 'contract', pa.contract_id);
      if (!c) errs.push('對應合約不存在（缺件）');
      else if (c.status !== '完成簽署') errs.push(`對應合約狀態為「${c.status}」，未完成簽署（缺件）`);
      else if (!contractCovers(data, c.id, pa.drug_code)) errs.push('對應合約之適用品項未含此代碼（缺件）');
    }
  } else if (pa.contract_requirement === '當時無須簽約') {
    if (!txt(pa.requirement_basis)) errs.push('選「當時無須簽約」須填說明／依據');
  }
  // 「待確認」：不以案件來源限制確認，由確認者依個案判斷；確認時標示「不完整」（B17）
  return errs;
}

// ================= 註記 =================
const ANNOT_EDIT = ['category', 'effective_date', 'basis'];

function createAnnotation(data, ctx, input) {
  const { drug_code, action, category, revision_id, price_action_id, effective_date, basis, original_event_id } = input || {};
  const c = code(drug_code);
  if (!E.ANNOTATION_ACTION.includes(action)) throw new SpecError('BAD_VALUE', '註記動作不正確');
  let revId = revision_id || null;
  if (action === '新增' || action === '改類') {
    if (!price_action_id) throw new SpecError('NO_PRICE_ACTION', '只有實際調高的個別品項才註記：新增／改類須連結調高紀錄（B03）');
    const pa = must(data, 'price_action', price_action_id);
    if (pa.drug_code !== c) throw new SpecError('MISMATCH', '調高紀錄與註記品項不一致');
    if (pa.confirm_status === '撤銷') throw new SpecError('REVOKED', '連結之調高紀錄已撤銷');
    if (!category) throw new SpecError('REQUIRED', '請選註記類別');
    revId = revId || pa.revision_id;
  }
  if ((action === '取消' || action === '更正') && !txt(basis)) throw new SpecError('REQUIRED', '取消或更正註記須填依據；不自動批次取消（Q07）');
  if (action === '更正') {
    if (!original_event_id) throw new SpecError('REQUIRED', '更正須指定原註記事件');
    const o = must(data, 'annotation_event', original_event_id);
    if (o.drug_code !== c) throw new SpecError('MISMATCH', '原註記事件與品項不一致');
    if (o.confirm_status !== '已確認') throw new SpecError('BAD_SUPERSEDE', '只能更正已確認之註記事件');
  }
  if (revId) must(data, 'recognition_revision', revId);
  return insert(data, ctx, 'annotation_event', dates({
    drug_code: c, action, category: category || null, revision_id: revId, price_action_id: price_action_id || null,
    effective_date, basis: txt(basis), original_event_id: original_event_id || null,
  }));
}

function updateAnnotation(data, ctx, id, changes, { expectedVersion } = {}) {
  return update(data, ctx, 'annotation_event', id, dates(pick(changes, ANNOT_EDIT)), { expectedVersion });
}

function submitAnnotation(data, ctx, id) {
  return setConfirmStatus(data, ctx, 'annotation_event', id, '待確認');
}

function withdrawAnnotation(data, ctx, id, reason) {
  const a = must(data, 'annotation_event', id);
  if (a.confirm_status === '已確認') throw new SpecError('CONFIRMED_READONLY', '已確認之註記事件不可撤銷；請以「取消」或「更正」事件辦理');
  return setConfirmStatus(data, ctx, 'annotation_event', id, '撤銷', { reason });
}

function validateAnnotation(data, ev, confirmingPaIds = []) {
  const errs = [];
  if (!ev.effective_date) errs.push('缺註記生效日');
  if (ev.action === '新增' || ev.action === '改類') {
    const pa = find(data, 'price_action', ev.price_action_id);
    if (!pa || pa.confirm_status === '撤銷') errs.push('連結的調高紀錄不存在或已撤銷');
    else if (pa.confirm_status !== '已確認' && !confirmingPaIds.includes(pa.id)) errs.push('連結的調高紀錄尚未確認（請一併確認）');
  }
  return errs;
}

// ================= 確認公告（整批） =================
// 任一驗證失敗整批不成立；op_id 由 session.run 處理（T17）
function confirmAnnouncement(data, ctx, { priceActionIds = [], annotationIds = [] } = {}) {
  if (!priceActionIds.length && !annotationIds.length) throw new SpecError('REQUIRED', '請選擇要確認的調高或註記');
  const errors = [];
  const pas = priceActionIds.map((id) => must(data, 'price_action', id));
  const evs = annotationIds.map((id) => must(data, 'annotation_event', id));
  for (const pa of pas) {
    if (pa.confirm_status === '已確認') continue;
    if (pa.confirm_status === '撤銷') { errors.push(`調高 ${pa.drug_code}：已撤銷`); continue; }
    const e = validatePriceAction(data, pa);
    if (e.length) errors.push(`調高 ${pa.drug_code}：${e.join('、')}`);
  }
  for (const ev of evs) {
    if (ev.confirm_status === '已確認') continue;
    if (ev.confirm_status === '撤銷') { errors.push(`註記 ${ev.drug_code}：已撤銷`); continue; }
    const e = validateAnnotation(data, ev, priceActionIds);
    if (e.length) errors.push(`註記 ${ev.drug_code}（${ev.action}）：${e.join('、')}`);
  }
  if (errors.length) throw new SpecError('VALIDATION', `驗證未通過，整批未確認：${errors.join('；')}`, { errors });
  const incomplete = [];
  for (const pa of pas) {
    if (pa.confirm_status === '已確認') continue;
    if (pa.contract_requirement === '待確認') {
      setDedicated(data, ctx, 'price_action', pa.id, { completeness: '不完整' }, { action: '標示不完整（簽約要求待確認，B17）', fields: ['completeness'] });
      incomplete.push(pa.drug_code);
    }
    setConfirmStatus(data, ctx, 'price_action', pa.id, '已確認');
  }
  for (const ev of evs) if (ev.confirm_status !== '已確認') setConfirmStatus(data, ctx, 'annotation_event', ev.id, '已確認');
  return { price_actions: priceActionIds.slice(), annotations: annotationIds.slice(), incomplete };
}

// ================= 查詢 =================
function supersededSet(data) {
  return new Set(list(data, 'price_action').filter((p) => p.supersedes_id && p.confirm_status === '已確認').map((p) => p.supersedes_id));
}

// 品項之調高歷程（已確認者；被更正取代者標示）
function priceHistory(data, drugCode) {
  const rep = supersededSet(data);
  return list(data, 'price_action').filter((p) => p.drug_code === drugCode)
    .map((p) => ({ ...p, superseded: rep.has(p.id) }))
    .sort((a, b) => ((a.effective_date || '') + a.created_at < (b.effective_date || '') + b.created_at ? -1 : 1));
}

// 依已確認註記事件計算指定日期之註記類別
function annotationOn(data, drugCode, day) {
  const evs = list(data, 'annotation_event').filter((e) => e.drug_code === drugCode && e.confirm_status === '已確認')
    .sort((a, b) => ((a.effective_date || '') + a.created_at < (b.effective_date || '') + b.created_at ? -1 : 1));
  const corrected = new Map();
  for (const e of evs) if (e.action === '更正') corrected.set(e.original_event_id, e);
  let category = null;
  let unknownDate = false;
  let pendingFuture = null;
  for (const e of evs) {
    if (e.action === '更正') continue;
    const eff = corrected.get(e.id) || e;
    const effDate = eff.effective_date || e.effective_date;
    if (!effDate) { unknownDate = true; continue; }
    if (effDate > day) { if (!pendingFuture) pendingFuture = { action: e.action, category: eff.category || e.category, effective_date: effDate }; continue; }
    if (e.action === '新增' || e.action === '改類') category = eff.category || e.category;
    else if (e.action === '取消') category = null;
  }
  return { category, unknown_date: unknownDate, upcoming: pendingFuture };
}

function annotationHistory(data, drugCode) {
  return list(data, 'annotation_event').filter((e) => e.drug_code === drugCode)
    .sort((a, b) => ((a.effective_date || '') + a.created_at < (b.effective_date || '') + b.created_at ? -1 : 1));
}

// 調高選取用：版本範圍名單，標示已有調高紀錄者
function scopeCandidates(data, revId) {
  const scope = [...revisionScope(data, revId)].sort();
  const pas = list(data, 'price_action').filter((p) => p.revision_id === revId && p.confirm_status !== '撤銷');
  return scope.map((c) => ({ drug_code: c, actions: pas.filter((p) => p.drug_code === c) }));
}

function listPriceActions(data, { revisionId, caseId, confirm, drugCode } = {}) {
  const rep = supersededSet(data);
  return list(data, 'price_action').filter((p) => (!revisionId || p.revision_id === revisionId) && (!caseId || p.case_id === caseId) &&
    (!confirm || p.confirm_status === confirm) && (!drugCode || p.drug_code === drugCode))
    .map((p) => ({ ...p, superseded: rep.has(p.id) }))
    .sort((a, b) => (a.drug_code === b.drug_code ? (a.created_at < b.created_at ? -1 : 1) : a.drug_code < b.drug_code ? -1 : 1));
}

function listAnnotations(data, { revisionId, priceActionId, confirm } = {}) {
  return list(data, 'annotation_event').filter((a) => (!revisionId || a.revision_id === revisionId) &&
    (!priceActionId || a.price_action_id === priceActionId) && (!confirm || a.confirm_status === confirm))
    .sort((a, b) => (a.drug_code === b.drug_code ? (a.created_at < b.created_at ? -1 : 1) : a.drug_code < b.drug_code ? -1 : 1));
}

// ================= 附件（先寫入並讀回驗雜湊，再於同一批成立紀錄；附件失敗則整批不成立，T18） =================
async function storeFiles(session, files) {
  if (session.mode !== 'edit') throw new SpecError('NOT_EDITING', '目前為查詢模式，請先取得編輯牌');
  const stored = [];
  for (const f of files || []) stored.push({ ...f, ...(await storeBlob(session.fs, f.bytes)) });
  return stored;
}

function refsOf(stored, label) {
  return stored.map((s) => ({ path: s.path, sha256: s.sha256, label: `${label} ${s.name}` }));
}

// 公告確認（可附公告文件）；整批成立或整批不成立
async function confirmAnnouncementWithFiles(session, sel, files = [], { opId } = {}) {
  const stored = await storeFiles(session, files);
  return session.run((d, ctx) => {
    const r = confirmAnnouncement(d, ctx, sel);
    const links = sel.priceActionIds && sel.priceActionIds.length ? sel.priceActionIds.map((id) => ({ entity: 'price_action', entity_id: id })) : [];

async function attachFiles(session, entity, entityId, files, { opId } = {}) {
  if (!files || !files.length) throw new SpecError('REQUIRED', '請選擇檔案');
  const stored = await storeFiles(session, files);
  return session.run((d, ctx) => {
    must(d, entity, entityId);
    return stored.map((s) => addAttachmentRecord(d, ctx, { orig_name: s.name, sha256: s.sha256, size: s.size, mime: s.mime || null }, [{ entity, entity_id: entityId }]).id);
  }, { opId, kind: '上傳附件', refs: refsOf(stored, '附件') });
}

function attachmentsOf(data, entity, entityId) {
  return list(data, 'attachment_link').filter((l) => l.entity === entity && l.entity_id === entityId)
    .map((l) => find(data, 'attachment', l.attachment_id)).filter(Boolean).sort((a, b) => (a.orig_name === b.orig_name ? a.version - b.version : a.orig_name < b.orig_name ? -1 : 1));
}

        if (p.confirm_status === '草稿') ops.push(btn('送待確認', () => guard(() => s.run((dd, k) => P.submitPriceAction(dd, k, p.id)))));
        ops.push(btn('撤銷', () => guard(() => withdrawPA(env, p))));
      }
      if (p.confirm_status === '已確認' && !p.superseded) ops.push(btn('更正', () => guard(() => correctPA(env, rev, p))));
      ops.push(btn('附件', () => guard(() => uploadTo(env, 'price_action', p.id))));
    }
    const label = p.superseded ? `${p.confirm_status}（已更正取代）` : p.confirm_status;
    t.querySelector('tbody').appendChild(h('tr', null, [cb, p.drug_code, `${p.price_before || '—'} → ${p.price_after || '—'}`, p.effective_date || '', `${p.announce_doc_no || ''} ${p.announce_date || ''}`,
      p.contract_requirement, c ? `${c.contract_no}（${c.status}）` : '', p.status, label, p.completeness,
      errs.length ? h('span', { class: 'warn-text', text: errs.join('；') }) : (p.confirm_status === '已確認' ? '' : '可確認'), h('span', null, ops)]
      .map((x) => (x instanceof Node ? h('td', null, x) : h('td', { text: x })))));
  }
  return h('section', { class: 'panel' }, h('h3', { text: `本次調高名單（${pas.length} 筆）` }),
    s.mode === 'edit' && pas.length ? h('div', { class: 'toolbar' }, btn('確認公告（勾選之調高及其註記）', () => guard(() => confirmUI(env, rev, [...chosen])), { primary: true })) : null,
    pas.length ? t : h('p', { class: 'note', text: '尚無調高紀錄。' }));
}

async function editPA(env, p) {
  const v = await formDialog(`編輯調高紀錄 ${p.drug_code}`, paFields(data(env), p));

}

async function withdrawPA(env, p) {

    { type: 'note', label: '連結之未確認註記一併撤銷；紀錄保留不刪除。' }]);
  if (!v) return;

}

async function correctPA(env, rev, p) {
  const v = await formDialog(`更正調高紀錄 ${p.drug_code}（原紀錄保留並標示取代）`, paFields(data(env), p));
  if (!v) return;
  await env.s.run((dd, k) => P.createPriceAction(dd, k, { ...clean(v), revision_id: rev.id, drug_code: p.drug_code, supersedes_id: p.id }), { opId: newId(), kind: '更正調高紀錄' });
}

async function confirmUI(env, rev, paIds) {
  const d = data(env);
  if (!paIds.length) throw new SpecError('REQUIRED', '請勾選要確認的調高紀錄');
  const pas = paIds.map((id) => find(d, 'price_action', id));
  const anns = list(d, 'annotation_event').filter((a) => paIds.includes(a.price_action_id) && (a.confirm_status === '草稿' || a.confirm_status === '待確認'));
  const errs = [];
  for (const p of pas) { const e = P.validatePriceAction(d, p); if (e.length) errs.push(`調高 ${p.drug_code}：${e.join('、')}`); }
  for (const a of anns) { const e = P.validateAnnotation(d, a, paIds); if (e.length) errs.push(`註記 ${a.drug_code}：${e.join('、')}`); }
  if (errs.length) throw new SpecError('VALIDATION', `驗證未通過，整批未確認：${errs.join('；')}`);
  const fileIn = h('input', { type: 'file', multiple: true, 'aria-label': '公告附件' });
  const incomplete = pas.filter((p) => p.contract_requirement === '待確認').map((p) => p.drug_code);
  const opId = newId();
  const ok = await dialog('確認公告', [
    h('p', { text: `將確認調高 ${pas.length} 筆、註記 ${anns.length} 筆；整批成立或整批不成立。系統登記確認不取代公文核定。` }),
    table(['代碼', '調高後', '生效日', '公告文號', '簽約要求'], pas.map((p) => [p.drug_code, p.price_after, p.effective_date, p.announce_doc_no, p.contract_requirement])),
    incomplete.length ? h('p', { class: 'warn-text', text: `簽約要求待確認者將標示「不完整」：${incomplete.join('、')}` }) : null,
    h('label', null, '公告附件（選填） ', fileIn)], [{ label: '取消', value: false }, { label: '確認', value: true, primary: true }]);
  if (!ok) return;
  const files = [];
  for (const f of fileIn.files) files.push({ name: f.name, mime: f.type || null, bytes: new Uint8Array(await f.arrayBuffer()) });
  await P.confirmAnnouncementWithFiles(env.s, { priceActionIds: paIds, annotationIds: anns.map((a) => a.id) }, files, { opId });
}

function annPanel(env, rev) {
  const { s, btn, guard } = env;
  const d = data(env);
  const anns = P.listAnnotations(d, { revisionId: rev.id });
  const t = table(['代碼', '動作', '類別', '註記生效日', '依據', '連結調高', '確認', '操作'], []);
  for (const a of anns) {
    const pa = a.price_action_id ? find(d, 'price_action', a.price_action_id) : null;
    const ops = [];
    if (s.mode === 'edit' && (a.confirm_status === '草稿' || a.confirm_status === '待確認')) {
      ops.push(btn('編輯', () => guard(() => editAnn(env, a))));
      ops.push(btn('撤銷', () => guard(async () => {
        const v = await formDialog('撤銷註記事件', [{ key: 'reason', label: '原因', required: true }]);
        if (v) await s.run((dd, k) => P.withdrawAnnotation(dd, k, a.id, v.reason));
      })));
    }
    if (s.mode === 'edit' && a.confirm_status === '已確認' && a.action !== '更正') ops.push(btn('更正', () => guard(() => newAnn(env, rev, '更正', a))));
    t.querySelector('tbody').appendChild(h('tr', null, [a.drug_code, a.action, a.category || '', a.effective_date || '（未知）', a.basis || '', pa ? `${pa.price_after || ''}（${pa.confirm_status}）` : '', a.confirm_status, h('span', null, ops)]

    s.mode === 'edit' ? h('div', { class: 'toolbar' }, btn('新增取消註記事件', () => guard(() => newAnn(env, rev, '取消'))),
      btn('確認選定註記（取消／更正）', () => guard(() => confirmAnnUI(env, rev)))) : null,
    anns.length ? t : h('p', { class: 'note', text: '尚無註記事件。' }));
}

async function editAnn(env, a) {
  const v = await formDialog(`編輯註記 ${a.drug_code}（${a.action}）`, [
    { key: 'category', label: '註記類別', type: 'select', options: [['', '（無）'], ...opts(E.CATEGORY)], value: a.category || '' },
    { key: 'effective_date', label: '註記生效日', type: 'date', value: a.effective_date }, { key: 'basis', label: '依據', type: 'textarea', value: a.basis }]);
  if (!v) return;
  await env.s.run((dd, k) => P.updateAnnotation(dd, k, a.id, { ...v, category: v.category || null }, { expectedVersion: a.row_version }));
}

async function newAnn(env, rev, action, orig) {
  const fields = [];
  if (!orig) fields.push({ key: 'drug_code', label: '藥品代碼', required: true, hint: '取消事件逐品項登錄並填依據' });
  if (action === '更正') fields.push({ key: 'category', label: '更正後類別', type: 'select', options: [['', '（無）'], ...opts(E.CATEGORY)], value: orig.category || '' });
  fields.push({ key: 'effective_date', label: '生效日', type: 'date', value: orig ? orig.effective_date : null }, { key: 'basis', label: '依據', type: 'textarea', required: true });
  const v = await formDialog(action === '更正' ? `更正註記 ${orig.drug_code}（原事件保留）` : '新增取消註記事件', fields);
  if (!v) return;
  await env.s.run((dd, k) => P.createAnnotation(dd, k, { drug_code: orig ? orig.drug_code : v.drug_code, action, category: v.category || null, revision_id: rev.id,
    effective_date: v.effective_date, basis: v.basis, original_event_id: orig ? orig.id : null }), { opId: newId(), kind: `註記${action}` });
}

async function confirmAnnUI(env, rev) {
  const d = data(env);
  const cands = P.listAnnotations(d, { revisionId: rev.id }).filter((a) => (a.confirm_status === '草稿' || a.confirm_status === '待確認') && (a.action === '取消' || a.action === '更正'));
  if (!cands.length) throw new SpecError('REQUIRED', '沒有待確認之取消／更正註記事件（新增註記隨調高一併確認）');
  const v = await formDialog('確認註記事件', [{ key: 'ids', label: '選擇', type: 'checks', required: true, options: cands.map((a) => [a.id, `${a.drug_code} ${a.action} ${a.effective_date || '（生效日未知）'}`]) }]);
  if (!v) return;
  await env.s.run((dd, k) => P.confirmAnnouncement(dd, k, { annotationIds: v.ids }), { opId: newId(), kind: '確認註記' });
}

// ================= 合約 =================
function contractFields(c = {}) {
  return [
    { key: 'contract_no', label: '合約編號', required: true, value: c.contract_no }, { key: 'firm', label: '簽約廠商', value: c.firm },
    { key: 'signed_date', label: '簽訂日', type: 'date', value: c.signed_date }, { key: 'effective_from', label: '生效日', type: 'date', value: c.effective_from },
    { key: 'expiry_date', label: '到期日', type: 'date', value: c.expiry_date, hint: '無到期日請留空，系統不推定' },
    { key: 'doc_version', label: '文件版本', value: c.doc_version }, { key: 'obligations', label: '供貨義務摘要', type: 'textarea', value: c.obligations },
    { key: 'status', label: '合約狀態', type: 'select', options: opts(E.CONTRACT_STATUS), value: c.status || '辦理中' },
  ];
}

function contractList(env) {
  const { s, btn, guard, render } = env;
  const st = env.ui.pricing;
  const d = data(env);
  const day = today();
  const alerts = P.contractAlerts(d, day);
  const kw = h('input', { type: 'text', size: 18, value: st.kw || '', placeholder: '合約編號、廠商、藥品代碼', 'aria-label': '合約關鍵字' });
  const rows = P.listContracts(d, { keyword: st.kw });
  const t = table(['合約編號', '簽約廠商', '狀態', '簽訂日', '到期', '品項數', '原合約'], []);
  for (const c of rows) {
    const orig = c.original_contract_id ? find(d, 'contract', c.original_contract_id) : null;
    t.querySelector('tbody').appendChild(h('tr', { class: 'clickable', tabindex: '0', on: { click: () => { st.contract = c.id; render(); } } },
      [c.contract_no, c.firm || '', c.status, c.signed_date || '', `${c.expiry_date || ''} ${P.contractExpiryText(c, day)}`, String(P.contractDrugs(d, c.id).length), orig ? orig.contract_no : '']
        .map((x) => h('td', { text: x }))));
  }
  return h('section', { class: 'panel' }, h('h2', { text: '合約' }),
    alerts.length ? h('div', { class: 'alert' }, h('strong', { text: `合約到期提醒（60日內，${alerts.length} 份）：` }),
      alerts.map((a) => `${a.contract_no} ${a.expiry_date} ${a.alert}`).join('；'), h('p', { class: 'note', text: '僅提醒檢視，不自動取消認定、註記或價格（B11）。' })) : null,
    h('div', { class: 'filters' }, h('label', null, '關鍵字 ', kw), btn('查詢', () => { st.kw = kw.value.trim() || null; render(); })),
    s.mode === 'edit' ? h('div', { class: 'toolbar' }, btn('新增合約', () => guard(() => newContract(env)), { primary: true })) : null,
    h('p', { class: 'note', text: `共 ${rows.length} 份。` }), t);
}

function codesOf(text) {
  return String(text || '').split(/[\s,，、;；]+/).map((x) => x.trim()).filter(Boolean);
}

async function newContract(env, original) {
  const fields = contractFields(original ? { contract_no: `${original.contract_no}-補`, firm: original.firm } : {});
  fields.push({ key: 'drugs', label: '適用藥品代碼', type: 'textarea', hint: '以空白、逗號或換行分隔' });
  const v = await formDialog(original ? `新增補充協議／新版合約（原合約 ${original.contract_no} 保留）` : '新增合約', fields);
  if (!v) return;
  const { drugs, ...rest } = v;
  const r = await env.s.run((dd, k) => P.createContract(dd, k, { ...rest, drugs: codesOf(drugs), original_contract_id: original ? original.id : null }).id, { opId: newId(), kind: '新增合約' });
  env.ui.pricing.contract = r;
}

function contractDetail(env) {
  const { s, btn, guard, render } = env;
  const st = env.ui.pricing;
  const d = data(env);
  const c = find(d, 'contract', st.contract);
  if (!c) { st.contract = null; return contractList(env); }
  const chain = P.contractChain(d, c.id);
  const affected = P.contractAffected(d, c.id);
  const parts = chain.map((x) => h('div', { class: x.id === c.id ? 'panel current' : 'panel' },
    h('h3', { text: `${x.contract_no}${x.original_contract_id ? '（補充協議／新版）' : '（原合約）'}｜${x.status}` }),
    h('p', { text: `廠商：${x.firm || ''}；簽訂 ${x.signed_date || '—'}；生效 ${x.effective_from || '—'}；到期 ${x.expiry_date || '—'}（${P.contractExpiryText(x, today())}）；文件版本 ${x.doc_version || '—'}` }),
    x.obligations ? h('p', { text: `供貨義務：${x.obligations}` }) : null,
    h('p', { text: `適用品項（${x.drugs.length}）：${x.drugs.map((dd) => dd.drug_code + (dd.effective_from || dd.effective_to ? `（${dd.effective_from || ''}～${dd.effective_to || ''}）` : '')).join('、') || '（無）'}` }),
    h('div', null, ' 附件：', x.attachments.length ? x.attachments.map((a) => btn(`${a.orig_name} v${a.version}`, () => guard(() => download(env, a)))) : '（無）')));
  return h('section', { class: 'panel' }, h('div', { class: 'toolbar' }, btn('← 回合約清單', () => { st.contract = null; render(); })),
    h('h2', { text: `合約 ${c.contract_no}` }),
    affected.length ? h('p', { class: 'warn-text', text: `已被 ${affected.length} 筆已確認調高引用（${affected.map((p) => p.drug_code).join('、')}）；修改須填原因（Q11）。` }) : null,
    s.mode === 'edit' ? h('div', { class: 'toolbar' },
      btn('編輯', () => guard(() => editContract(env, c))),
      btn('新增適用品項', () => guard(() => addDrugs(env, c))),
      btn('上傳附件', () => guard(() => uploadTo(env, 'contract', c.id))),
      btn('新增補充協議／新版', () => guard(() => newContract(env, c)))) : null,
    h('p', { class: 'note', text: '合約版本鏈（原件保留）：' }), parts);
}

async function editContract(env, c) {
  const affected = P.contractAffected(data(env), c.id);
  const fields = contractFields(c);
  if (affected.length) fields.push({ key: 'reason', label: '修改原因', type: 'textarea', required: true, hint: `受影響調高：${affected.map((p) => p.drug_code).join('、')}` });
  const v = await formDialog(`編輯合約 ${c.contract_no}`, fields);
  if (!v) return;
  const { reason, ...changes } = v;
  await env.s.run((dd, k) => P.updateContract(dd, k, c.id, changes, { expectedVersion: c.row_version, reason }));
}

async function addDrugs(env, c) {
  const v = await formDialog(`合約 ${c.contract_no} 新增適用品項`, [{ key: 'drugs', label: '藥品代碼', type: 'textarea', required: true, hint: '以空白、逗號或換行分隔' },
    { key: 'effective_from', label: '適用起日', type: 'date' }, { key: 'effective_to', label: '適用迄日（不含）', type: 'date' }]);
  if (!v) return;
  await env.s.run((dd, k) => codesOf(v.drugs).map((code) => P.addContractDrug(dd, k, c.id, code, v).id), { opId: newId(), kind: '新增合約品項' });
}

async function uploadTo(env, entity, id) {
  const fileIn = h('input', { type: 'file', multiple: true, 'aria-label': '選擇附件' });
  const ok = await dialog('上傳附件', [h('p', { text: '原檔以雜湊保存於資料夾 attachments/；同名再上傳者版本＋1，原件保留。' }), fileIn],
    [{ label: '取消', value: false }, { label: '上傳', value: true, primary: true }]);
  if (!ok || !fileIn.files.length) return;
  const files = [];
  for (const f of fileIn.files) files.push({ name: f.name, mime: f.type || null, bytes: new Uint8Array(await f.arrayBuffer()) });
  await P.attachFiles(env.s, entity, id, files, { opId: newId() });
}

async function download(env, a) {
  const bytes = await readBlob(env.s.fs, a.sha256);
  await saveBlobAs(a.orig_name, new Blob([bytes], { type: a.mime || 'application/octet-stream' }));
}

return { pricingTab };

async function doBackup(env) {
  const s = env.s;
  const ms = Date.now();
  const { bytes, manifest } = await B.buildBackup(s.fs, { exportedAt: isoUtc(ms), actor: actorText(s.session) });
  const name = exportNamer().name('備份', ms, manifest.source_revision, false, 'zip');
  const r = await saveBlobAs(name, new Blob([bytes], { type: 'application/zip' }));
  if (!r || !r.saved) return;
  try {
    await X.logExport(s.fs, { name, bytes }, { kind: '備份', ms, actor: actorText(s.session), revision: manifest.source_revision, unsaved: false, condition: `檔案 ${manifest.files.length} 個`, count: manifest.files.length });
  } catch (e) {
    await alertBox('匯出紀錄未寫入', '備份已匯出，但寫入資料夾匯出紀錄失敗；不影響已下載檔案。');
  }
  await alertBox('備份完成', `已匯出 ${name}（產生後已重讀逐檔驗證）。`, ...manifestLines(manifest));
}

async function doVerify() {
  const f = await pickZip('選擇備份檔（.zip）');
  if (!f) return;
  const v = await B.verifyBackup(f.bytes);
  if (v.ok) await alertBox('備份驗證通過', `「${f.name}」所有檔案雜湊、資料引用及稽核雜湊鏈皆一致。`, ...manifestLines(v.manifest));
  else await alertBox('備份驗證未通過', `「${f.name}」不可用於還原：`, table(['原因'], v.errors.map((e) => [e])));
}

async function doRestore(env) {
  const s = env.s;
  const f = await pickZip('選擇要還原的備份檔（.zip）');
  if (!f) return;
  const v = await B.verifyBackup(f.bytes);
  if (!v.ok) { await alertBox('備份驗證未通過，拒絕還原', '資料夾不變。原因：', table(['原因'], v.errors.map((e) => [e]))); return; }
  const reason = h('textarea', { rows: 3, cols: 48, 'aria-label': '還原原因' });
  const msg = h('p', { class: 'warn-text', role: 'alert' });
  const ok = await dialog('確認還原', [
    ...manifestLines(v.manifest).map((t) => h('p', { text: t })),
    v.manifest.folder_id !== s.meta.folder_id ? h('p', { class: 'warn-text', text: '此備份來自其他資料夾（folder_id 不同）。' }) : null,
    h('p', { text: `還原後成為本資料夾 r${String(s.current.revision + 1).padStart(6, '0')}；目前版本及歷史版本檔保留可唯讀開啟比對（Q12）。` }),
    h('label', null, '還原原因＊ ', reason), msg],
  [{ label: '取消', value: false }, { label: '還原', value: true, primary: true, validate: () => { if (!reason.value.trim()) { msg.textContent = '請填還原原因'; return false; } return true; } }]);
  if (!ok) return;
  const r = await B.restoreBackup(s, f.bytes, { reason: reason.value.trim(), opId: newId(), backupName: f.name });
  await alertBox('還原完成', `已還原為 r${String(s.current.revision).padStart(6, '0')}；寫入檔案 ${r.files_written} 個、沿用 ${r.files_reused} 個。稽核已記錄來源備份。`);
}

return { pickZip, backupTab };
})();

  if (!parts.length) return { std: '待確認', flags, issues: [`類別「${raw}」無法對應`] };

// 討論歷程拆成議案候選；每行一個，保留原文；日期只取有明確年月日者（不以年月補日）
function parseMeetings(text) {
  const out = [];
  for (const line of String(text || '').split('\n')) {
    let ln = line.trim().replace(/[，,]$/, '').replace(/^\d+\.\s*/, '');
    if (!ln) continue;
    let type = '其他';
    if (ln.includes('藥事小組')) type = '藥事小組';
    else if (/擬訂|擬定|共擬/.test(ln)) type = '共同擬訂';
    else if (ln.includes('專家')) type = '專家';
    const m = MEET_DATE.exec(ln);
    const date = m && m[3] ? parseDate(`${m[1]}/${m[2]}/${m[3]}`) : null;

async function readWorkbook(table, { sheet = 'final', name, bytes } = {}) {

  const headers = readHeaders(table, sheet, 1);
  const idx = matchCols(headers);
  const rows = [];
  for (const r of table.rows(sheet)) {
    if (r.rowNo === 1) continue;
    const raw = {};
    let any = false;
    for (const [k, i] of Object.entries(idx)) { const v = cellText(r.cells.get(i)); raw[k] = v; if (v !== null) any = true; }
    if (!any) continue;
    const { parsed, issues } = parseRow(raw);
    rows.push({ row_no: r.rowNo, raw, parsed, issues });
  }
  return { source_name: name, sha256: await sha256Bytes(bytes), sheet, rows, bytes };
}

    let batch = list(d, 'migration_batch').find((b) => b.sha256 === staged.sha256 && b.sheet === staged.sheet);
    const first = !batch;
    if (!batch) batch = insert(d, ctx, 'migration_batch', { source_name: staged.source_name, sha256: staged.sha256, sheet: staged.sheet, row_count: staged.rows.length });
    const seen = new Set(list(d, 'migration_row').filter((r) => r.source_sha256 === staged.sha256 && r.sheet === staged.sheet).map((r) => r.row_no));
    let added = 0;
    for (const r of staged.rows) {
      if (seen.has(r.row_no)) continue;
      insert(d, ctx, 'migration_row', { batch_id: batch.id, source_sha256: staged.sha256, sheet: staged.sheet, row_no: r.row_no, raw: r.raw, parsed: r.parsed, issues: r.issues });

    return { batch_id: batch.id, new: added, already_staged: staged.rows.length - added, total: staged.rows.length };

function listRows(data, { sha, status } = {}) {
  return list(data, 'migration_row').filter((r) => (!sha || r.source_sha256 === sha) && (!status || r.status === status))
    .sort((a, b) => (a.source_sha256 === b.source_sha256 ? a.row_no - b.row_no : a.source_sha256 < b.source_sha256 ? -1 : 1));
}

function mergeCandidates(data, sha) {
  const groups = new Map();
  for (const r of listRows(data, { sha })) {
    for (const k of ['seq', 'ann_name', 'group_code']) {
      const v = r.parsed && r.parsed[k];
      if (!v) continue;
      const key = `${k}|${v}`;
      if (!groups.has(key)) groups.set(key, { key: COLS[k], value: v, rows: [] });
      groups.get(key).rows.push(r.row_no);
    }

  if (p.contract_code_clues && p.contract_code_clues.length) notes.push('協議藥品代碼線索（未核驗）：' + p.contract_code_clues.join('、'));

  if (p.group_item) notes.push(`分組項目原值：${p.group_item}`);
  if (p.not_recognized) notes.push('原文註明非認列（參考特殊藥品精神調高）');

    completeness: '不完整', pending_fields: 'recv_date,recv_doc_no,applicant', source_ref: src, notes: notes.join('\n\n'),
  });

    const ag = addAgenda(data, ctx, { meeting_id: mt.id, case_id: c.id, subject: title, original_text: m.original, discussion: `移轉候選議案（第${i + 1}次）；決議內容須由價格異動歷程人工拆解` });

      category: cat, original_category: p.category, scope_text: scope, rule: rule || null, conditions_text: p.side_decision,

    { label: '確定', value: 'ok', primary: true, validate: () => {
      if (k1.value.trim().length < MIN_KEYWORD_LENGTH) { msg.textContent = `至少 ${MIN_KEYWORD_LENGTH} 個字`; return false; }
      if (k1.value !== k2.value) { msg.textContent = '兩次輸入不同'; return false; }
      return true;
    } },
  ]);
  return v ? k1.value : null;
}

// ---------- 復原草稿 ----------
async function offerRecovery() {
  const s = ui.session;
  const rc = await s.recoveryCheck();
  if (rc.kind === 'none' || rc.kind === 'error') return;
  const d = rc.draft;
  const info = `本機有復原草稿：${fmtIso(d.saved_at)}，${who(d)}，未儲存變更 ${d.dirty} 項，基準 ${revLabel(d.base_revision)}（目前 ${revLabel(s.current.revision)}）。`;
  if (rc.kind === 'same_base') {
    const v = await dialog('復原草稿', [h('p', { text: info }), h('p', { text: '復原須先取得編輯牌。' })], [
      { label: '稍後再說', value: null },
      { label: '放棄草稿', value: 'discard' },
      { label: '取得編輯牌並復原', value: 'apply', primary: true },
    ]);
    if (v === 'discard') await s.discardDraft();
    if (v === 'apply') {
      const r = await s.startEdit();
      if (!r.ok) { await explainStartFail(r); return; }
      ui.recovering = true;
      try { await afterAcquire(r); } finally { ui.recovering = false; }
      await s.applyDraft();
    }
  } else {
    const v = await dialog('復原草稿（基準不同）', [
      h('p', { text: info }),
      h('p', { class: 'warn-text', text: '資料夾已有較新版本，草稿不自動套用。請另存為復原檔，核對後手動重套。' }),
    ], [
      { label: '稍後再說', value: null },
      { label: '放棄草稿', value: 'discard' },
      { label: '另存為復原檔', value: 'export', primary: true },
    ]);
    if (v === 'export') {
      const name = `特藥_復原草稿_${taipeiCompact(Date.now())}_${revLabel(d.base_revision)}.json`;
      const r = await saveTextAs(name, JSON.stringify(d, null, 2));
      if (r.saved) {
        const v2 = await dialog('已另存', [h('p', { text: `已存為「${r.name}」。要刪除本機草稿嗎？` })], [
          { label: '保留', value: null }, { label: '刪除本機草稿', value: 'del', primary: true },
        ]);
        if (v2 === 'del') await s.discardDraft();
      }
    }
    if (v === 'discard') {
      const ok = await dialog('確認放棄', [h('p', { text: '放棄後無法取回此草稿。確定放棄？' })], [{ label: '取消', value: null }, { label: '放棄', value: true, primary: true }]);
      if (ok) await s.discardDraft();
    }
  }
}

// ---------- 編輯牌 ----------
async function explainStartFail(r) {
  const s = ui.session;
  if (r.status === 'held' || r.status === 'checking') {
    const t = r.token;
    const last = r.lastSeen ? taipeiHM(r.lastSeen) : '確認中';
    const v = await dialog('編輯牌在他人手上', [
      h('p', { text: `編輯牌目前在 ${(t.holder && t.holder.user) || '（不明）'}（電腦：${(t.holder && t.holder.pc) || '不明'}）手上，自 ${taipeiHM(parseIso(t.acquired_at))} 起，最後回應 ${last}。` }),
      r.status === 'checking' ? h('p', { class: 'warn-text', text: '檔案時間與本機時間差異異常，正以心跳序號觀察判定（確認中）。' }) : null,
      h('p', { text: '請待對方結束編輯，或使用「強制收回」。' }),
    ], [
      { label: '繼續查詢', value: null },
      { label: '重新檢查', value: 'retry' },
      { label: '強制收回', value: 'force', primary: true },
    ]);
    if (v === 'retry') { const r2 = await s.startEdit(); if (!r2.ok) await explainStartFail(r2); else await afterAcquire(r2); }
    if (v === 'force') await doForce();
    return;
  }
  const map = {
    blocked: ['只能查詢', ...(r.reasons || [])],
    tab_locked: ['只能查詢', '此資料夾已在同一瀏覽器的另一分頁編輯中。請回到該分頁，或先關閉該分頁。'],
    stale_view: ['資料夾有新版', '資料夾已有新版本，請先按「重新載入」再開始編輯。'],
    race: ['取牌未成功', `幾乎同時有人取牌，目前持牌：${who(r.token && r.token.holder)}。已退回查詢模式。`],
    error: ['取牌失敗', r.error || ''],
  };
  const m = map[r.status] || ['無法開始編輯', r.status];
  await alertBox(m[0], ...m.slice(1));
}

async function afterAcquire(r) {
  if (r.status === 'took_local' && r.previous) {
    await alertBox('已取得編輯牌', `前一位持牌者為本瀏覽器先前的分頁（${who(r.previous.holder)}，最後回應 ${fmtIso(r.previous.heartbeat_at)}），該分頁已關閉，視同已歸還。`);
  }
  if (r.status === 'took_stale' && r.previous) {
    await alertBox('已取得編輯牌', `前一位持牌者 ${who(r.previous.holder)} 最後回應 ${fmtIso(r.previous.heartbeat_at)}，已超過 ${ui.session.settings.stale_min} 分鐘無回應，視為已關閉。`);
  }
  if (await ui.session.keywordMissing()) {
    const kw = await askNewKeyword('關鍵詞檔不存在，請重新設定');
    if (kw) await ui.session.resetMissingKeyword(kw);
  }
  startTimers();
  if (!ui.session.hasUnsaved || (ui.session.dirty === 0)) {
    const rc = await ui.session.recoveryCheck();
    if (rc.kind === 'same_base' && !ui.recovering) {
      const v = await dialog('復原草稿', [h('p', { text: `本機有復原草稿（${fmtIso(rc.draft.saved_at)}，未儲存變更 ${rc.draft.dirty} 項），基準與目前版本相同。` })], [
        { label: '稍後再說', value: null }, { label: '放棄草稿', value: 'discard' }, { label: '復原', value: 'apply', primary: true },
      ]);
      if (v === 'apply') await ui.session.applyDraft();
      if (v === 'discard') await ui.session.discardDraft();
    }
  }
}

async function doStartEdit() {
  const r = await ui.session.startEdit();
  if (!r.ok) { await explainStartFail(r); return; }
  await afterAcquire(r);
}

async function doEndEdit() {
  const s = ui.session;
  let choice;
  if (s.dirty > 0) {
    choice = await dialog('結束編輯', [h('p', { text: `有 ${s.dirty} 項未儲存變更。` })], [
      { label: '取消', value: null },
      { label: '放棄變更', value: 'discard' },
      { label: '保留本機草稿', value: 'draft' },
      { label: '儲存', value: 'save', primary: true },
    ]);
    if (!choice) return;
  }
  const r = await s.endEdit(choice);
  if (r.releaseError) await alertBox('還牌未完成', `編輯牌改寫失敗：${r.releaseError}。他人須待 ${s.settings.stale_min} 分鐘無心跳後才能取牌。`);
}

async function doSave() {
  const s = ui.session;
  try {
    const r = await s.save();
    if (r.status === 'already') await alertBox('已儲存', '先前一次儲存已完成（依 save_id 判定），未重複建立版本。');
  } catch (e) {
    if (e.code === 'OVERWRITTEN') { await alertBox('目前版本已被其他人覆蓋', e.message, '本次變更仍保留於復原草稿。'); return; }
    if (e.code === 'CONFLICT') { await alertBox('儲存被拒', e.message, '你的變更已保留於本機復原草稿。請結束編輯（保留草稿）→重新載入→核對後重套。'); return; }
    if (e.code === 'TOKEN_LOST') { await alertBox('儲存被拒', e.message); return; }
    throw e;
  }
}

async function doForce() {
  const s = ui.session;
  const st = s.guard.status();
  if (st.locked) { await alertBox('暫停嘗試', `連續輸錯，請 ${Math.ceil(st.remainMs / 1000)} 秒後再試。`); return; }
  const kw = h('input', { type: 'password', autocomplete: 'off' });
  const reason = h('input', { type: 'text', size: 30 });
  const msg = h('p', { class: 'warn-text', role: 'alert' });
  const holder = s.tokenStatus && s.tokenStatus.token && s.tokenStatus.token.holder;
  const v = await dialog('強制收回編輯牌', [
    h('p', { text: `目前持牌：${who(holder)}。收回後對方將於下次心跳（約${s.settings.heartbeat_sec}秒內）改為查詢模式，其未儲存變更保留於對方電腦的復原草稿。` }),
    h('label', null, '關鍵詞 ', kw), h('br'), h('label', null, '收回原因 ', reason), msg,
  ], [
    { label: '取消', value: null },
    { label: '強制收回', value: 'go', primary: true, validate: () => {
      if (!reason.value.trim()) { msg.textContent = '請填收回原因'; return false; }
      return true;
    } },
  ]);
  if (!v) return;
  const r = await s.forceTakeover(kw.value, reason.value);
  if (r.ok) { await alertBox('已收回', '已取得編輯牌。收回紀錄將於下次存檔（或結束編輯時）寫入稽核。'); await afterAcquire(r); return; }
  const map = {
    wrong: `關鍵詞不正確，未收回。再錯 ${r.remaining} 次將暫停30秒。`,
    locked: `連續輸錯，請 ${Math.ceil((r.remainMs || 0) / 1000)} 秒後再試。`,
    no_keyword: '尚未設定關鍵詞（control/keyword.json 不存在），無法強制收回。請待持牌者結束編輯或逾時；取牌後可重新設定。',
    need_reason: '請填收回原因。',
    blocked: '只能查詢：' + (r.reasons || []).join('；'),
    tab_locked: '此資料夾已在同一瀏覽器的另一分頁編輯中。',
    stale_view: '資料夾有新版，請先重新載入。',
    race: '收回時有人同時取牌，未成功。',
  };
  await alertBox('未收回', map[r.status] || r.status);
}

async function doReload() {
  const s = ui.session;
  if (s.mode === 'edit' && s.hasUnsaved) { await alertBox('有未儲存變更', '請先儲存或結束編輯（保留草稿）後再重新載入。'); return; }
  await s.reload();
  startTimers();
}

// ---------- 畫面 ----------
function renderStatusBar() {
  const s = ui.session;
  const bar = h('div', { class: 'statusbar', role: 'status' });
  if (!s || s.mode === 'closed') {
    bar.appendChild(h('span', { text: '尚未開啟資料夾' }));
    return bar;
  }
  const st = s.statusInfo();
  const modeText = st.mode === 'edit' ? '編輯中' : st.mode === 'query' ? '查詢' : '無法開啟';
  bar.appendChild(h('span', { class: 'chip' + (st.mode === 'edit' ? ' chip-edit' : ''), text: `模式：${modeText}` }));
  bar.appendChild(h('span', { text: `資料夾：${ui.folderName}` }));
  const info = s.committed && s.committed.data && s.committed.data.info;
  if (info && info.demo) bar.appendChild(h('span', { class: 'chip chip-warn', text: '示範資料夾（非正式資料）' }));
  const t = st.token;
  let tokText = '編輯牌：狀態不明';
  if (t) {
    if (t.status === 'free') tokText = '編輯牌：無人持有';
    else if (t.status === 'mine') tokText = `編輯牌：本分頁持有（自 ${taipeiHM(parseIso(t.token.acquired_at))}）`;
    else if (t.status === 'held') tokText = `編輯牌：${who(t.token.holder)}持有（自 ${taipeiHM(parseIso(t.token.acquired_at))}，最後回應 ${taipeiHM(t.lastSeen)}）`;
    else if (t.status === 'checking') tokText = `編輯牌：${who(t.token.holder)}持有（確認中）`;
    else if (t.status === 'stale') tokText = `編輯牌：${who(t.token.holder)}已逾時無回應（可取牌）`;
  }
  if (st.tokenUncertain) tokText = '編輯牌狀態不明（心跳寫入失敗，暫停存檔）';
  bar.appendChild(h('span', { class: st.tokenUncertain ? 'warn-text' : '', text: tokText }));
  if (st.revision !== undefined && st.revision !== null) bar.appendChild(h('span', { text: `${revLabel(st.revision)}｜${fmtIso(st.savedAt)}` }));
  bar.appendChild(h('span', { class: st.unsaved ? 'warn-text' : '', text: `未儲存變更：${st.unsaved}${st.pendingAudit && !st.unsaved ? `（待寫入稽核 ${st.pendingAudit} 筆）` : ''}` }));
  bar.appendChild(h('span', { text: masterStatusText(s.committed.data) }));
  if (st.newerAvailable) bar.appendChild(h('span', { class: 'chip chip-warn', text: '資料夾有新版，請重新載入' }));
  return bar;
}

function renderToolbar() {
  const s = ui.session;
  const bar = h('div', { class: 'toolbar' });
  if (!s || (s.mode !== 'query' && s.mode !== 'edit')) return bar;
  if (s.mode === 'query') {
    const blockers = s.editBlockers();
    bar.appendChild(btn('開始編輯', () => guard(doStartEdit), { primary: true, disabled: blockers.length > 0, title: blockers.join('；') }));
    const t = s.tokenStatus;
    if (t && (t.status === 'held' || t.status === 'checking')) bar.appendChild(btn('強制收回', () => guard(doForce), { disabled: blockers.length > 0 }));
    bar.appendChild(btn('重新載入', () => guard(doReload)));
  } else {
    bar.appendChild(btn('儲存', () => guard(doSave), { primary: true, disabled: !s.hasUnsaved || s.tokenUncertain }));
    bar.appendChild(btn('結束編輯', () => guard(doEndEdit)));
  }
  bar.appendChild(btn('關閉資料夾', () => guard(closeFolder)));
  return bar;
}

async function closeFolder() {
  const s = ui.session;
  if (s && s.mode === 'edit') {
    await doEndEdit();
    if (s.mode === 'edit') return;
  }
  stopTimers();
  ui.session = null;
  ui.folderName = '';
}

        [{ label: '取消', value: null }, { label: '載入', value: true, primary: true }]);
      if (!ok) return;
      await s.loadDemo();
      await alertBox('已載入', '示範資料已成為未儲存變更，請按「儲存」。');
    })));
  }
  return box;
}

let historyCache = null;

let exportLogCache = null;
function renderHistory() {
  const s = ui.session;
  const box = h('section', { class: 'panel' }, h('h2', { text: '儲存歷程' }),
    btn('檢查全部版本檔', () => guard(async () => { historyCache = await s.history(); })));
  if (historyCache) {
    box.appendChild(table(['revision', '儲存時間', '操作者', '摘要', '雜湊檢查', '狀態', ''], historyCache.slice().reverse().map((r) => [
      revLabel(r.revision),
      fmtIso(r.header && r.header.saved_at),
      who(r.header && r.header.saved_by),
      (r.header && r.header.summary) || '',
      r.ok ? '✔ 一致' : '✘ ' + r.notes.join('；'),
      r.isCurrent ? '目前版本' : r.inChain ? '歷史版本' : '未被引用（儲存中斷殘留或分支）',
      btn('唯讀檢視', () => guard(() => viewVersion(r.name))),
    ])));
  }
  box.appendChild(h('h3', { text: '匯出紀錄' }));
  box.appendChild(h('div', { class: 'toolbar' },
    btn('讀取匯出紀錄', () => guard(async () => { exportLogCache = { all: await X.readExportLog(s.fs), found: null }; })),
    h('label', null, '依檔案反查來源版本（H16） ', h('input', { type: 'file', 'aria-label': '反查匯出檔', on: { change: (e) => { const f = e.target.files[0]; if (f) guard(async () => {
      const sha = await sha256Bytes(new Uint8Array(await f.arrayBuffer()));
      exportLogCache = { all: exportLogCache ? exportLogCache.all : await X.readExportLog(s.fs), found: { name: f.name, sha, rows: await X.findExportBySha(s.fs, sha) } };
    }); } } }))));
  if (exportLogCache && exportLogCache.found) {
    const fd = exportLogCache.found;
    box.appendChild(h('p', { class: fd.rows.length ? '' : 'warn-text', text: fd.rows.length ? `「${fd.name}」（SHA-256 ${fd.sha.slice(0, 16)}…）為以下匯出：` : `「${fd.name}」（SHA-256 ${fd.sha.slice(0, 16)}…）查無匯出紀錄（檔案可能被修改或非本資料夾匯出）。` }));
  }
  const logRows = exportLogCache ? (exportLogCache.found ? exportLogCache.found.rows : exportLogCache.all.slice(-50).reverse()) : [];
  if (exportLogCache) box.appendChild(table(['匯出時間', '檔名', '種類', '條件', '筆數', 'revision', '程式版本', '操作者', 'SHA-256前16碼'], logRows.map((e) => e.broken ? ['（無法解析之列）', e.raw, '', '', '', '', '', '', ''] :
    [fmtIso(e.exported_at), e.file_name, e.kind, e.condition || '', String(e.count), X.revisionTag(e.revision, e.unsaved), e.app_version, e.actor || '', (e.sha256 || '').slice(0, 16)])));
  const audit = s.committed.audit.slice(-50).reverse();
  box.appendChild(h('h3', { text: '稽核紀錄（最近50筆）' }));
  box.appendChild(table(['序號', '時間', '操作者', '動作', '原因'], audit.map((e) => [e.seq, fmtIso(e.at), who(e), e.action, e.reason || ''])));
  return box;
}

function renderSettings() {
  const s = ui.session;
  const cur = s.settings;
  const editable = s.mode === 'edit';
  const inputs = {};
  const rows = Object.keys(DEFAULT_SETTINGS).map((k) => {
    const v = cur[k];
    const inp = typeof v === 'boolean'
      ? h('input', { type: 'checkbox', checked: v, disabled: !editable })
      : typeof v === 'string'
        ? h('input', { type: 'text', value: v, disabled: !editable, size: 20 })
        : h('input', { type: 'number', value: String(v), disabled: !editable, style: 'width:6em' });
    inputs[k] = inp;
    return [settingLabel(k), inp, String(DEFAULT_SETTINGS[k])];
  });
  const box = h('section', { class: 'panel' }, h('h2', { text: '設定' }),
    editable ? null : h('p', { class: 'note', text: '查詢模式僅可檢視；修改須先取得編輯牌。' }),
    table(['項目', '值', '預設'], rows));
  if (editable) {
    box.appendChild(btn('套用設定（成為未儲存變更）', () => guard(async () => {
      const patch = {};
      for (const [k, inp] of Object.entries(inputs)) patch[k] = inp.type === 'checkbox' ? inp.checked : inp.value;
      const r = await s.updateSettings(patch);
      if (!r.changed) await alertBox('未變更', '設定值與目前相同。');
    }), { primary: true }));
    box.appendChild(h('h3', { text: '強制收回關鍵詞' }));
    box.appendChild(btn('修改關鍵詞', () => guard(async () => {
      const old = h('input', { type: 'password', autocomplete: 'current-password' });
      const ok = await dialog('修改關鍵詞', [h('label', null, '原關鍵詞 ', old)], [{ label: '取消', value: null }, { label: '下一步', value: true, primary: true }]);
      if (!ok) return;
      const nk = await askNewKeyword('輸入新關鍵詞');
      if (!nk) return;
      await s.changeKeyword(old.value, nk);
      await alertBox('已修改', '關鍵詞已更新；稽核紀錄將於下次存檔寫入。');
    })));
  }
  return box;
}

function renderAbout() {
  const s = ui.session;
  return [
    h('section', { class: 'panel' }, h('h2', { text: '關於' }),
      table(['項目', '內容'], [
        ['程式版本', APP_VERSION], ['資料結構版本', String(SCHEMA_VERSION)], ['建置日期', BUILD_DATE], ['原始碼commit', BUILD_COMMIT],
        ['資料夾id', s.meta ? s.meta.folder_id : ''], ['本分頁工作階段id', s.session.id],
        ['使用者', who(s.session)], ['開啟位置', window.location.protocol + '//' + window.location.host + window.location.pathname],
        ['瀏覽器', navigator.userAgent],
      ]),
      h('p', { class: 'note', text: '編輯牌是程式之間的約定，不是檔案伺服器仲裁的獨占鎖；關鍵詞用來防止誤按與隨意搶牌，不是資安控管（第4.6節第15、16點）。' })),
    h('section', { class: 'panel' }, h('h2', { text: '啟動自檢' }), renderSelfCheck()),
  ];
}

function render() {
  const root = $root();
  clear(root);
  root.appendChild(h('header', { class: 'top' },
    h('h1', { text: '特殊藥品認定、調高及供貨合約管理系統' }),
    h('span', { class: 'ver', text: `v${APP_VERSION}｜資料結構 ${SCHEMA_VERSION}` })));
  root.appendChild(renderStatusBar());
  const s = ui.session;
  if (!s) {
    root.appendChild(h('main', null, renderStart()));
    return;
  }
  root.appendChild(renderToolbar());
  if (s.mode === 'error') {
    root.appendChild(h('main', null, renderError(), h('div', { class: 'toolbar' }, btn('關閉資料夾', () => guard(closeFolder)))));
    return;
  }
  root.appendChild(renderTabs());
  const env = { s, ui, btn, guard, render };
  const views = { home: renderHome, cases: () => casesTab(env), meetings: () => meetingsTab(env), master: () => masterTab(env), rule: () => ruleTab(env), recog: () => recognitionTab(env), pricing: () => pricingTab(env), query: () => queryTab(env), diff: () => diffTab(env), backup: () => backupTab(env), migration: () => migrationTab(env), history: renderHistory, settings: renderSettings, about: renderAbout };
  root.appendChild(h('main', null, (views[ui.tab] || renderHome)()));
}

function boot() {
  ui.check = selfCheck(window);
  window.addEventListener('beforeunload', (e) => {
    if (ui.session && ui.session.hasUnsaved) { e.preventDefault(); e.returnValue = ''; }
  });
  // 列印頁尾（第11.5節五）：程式版本、資料revision、列印時間；頁次由列印樣式 @page 提供
  window.addEventListener('beforeprint', () => {
    const el = document.getElementById('print-footer');
    if (!el) return;
    const s = ui.session;
    const rev = s && s.current ? `r${String(s.current.revision).padStart(6, '0')}${s.hasUnsaved ? '+未儲存' : ''}` : '（未開啟資料夾）';
    el.textContent = `特殊藥品管理 v${APP_VERSION}（${BUILD_COMMIT}）｜資料結構 ${SCHEMA_VERSION}｜資料 ${rev}${ui.folderName ? '｜' + ui.folderName : ''}｜列印時間 ${taipeiDisplay(Date.now())}`;
  });
  window.addEventListener('pagehide', () => {
    if (ui.session) ui.session.closing();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && ui.session) onPoll();
  });
  render();
}

boot();

return {  };
})();

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>特殊藥品管理 v0.4.0</title>
<style>
/* 外觀（第10節）：灰白底、深色框線、強調色 Tiffany Blue #81D8CF、輔色淡粉；扁平；按鈕深色外框，按下不變文字與底色。 */
:root {
  --bg: #f4f4f2; --panel: #ffffff; --line: #2b2b2b; --text: #1e1e1e; --muted: #555555;
  --accent: #81d8cf; --accent-weak: #dcf3f0; --accent-deep: #3e8f86;
  --pink: #f7e1e5; --pink-deep: #8a2f40;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font-family: "LXGW WenKai TC", "霞鶩文楷 TC", "Microsoft JhengHei", "微軟正黑體", sans-serif;
  font-size: 15px; line-height: 1.6;
}
#app { max-width: 1280px; margin: 0 auto; padding: 0 16px 32px; }
header.top { display: flex; align-items: baseline; gap: 16px; padding: 12px 0 4px; border-bottom: 3px solid var(--accent); flex-wrap: wrap; }
header.top h1 { font-size: 20px; margin: 0; }
.ver { color: var(--muted); font-size: 13px; }
.statusbar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 6px 8px; margin: 8px 0; background: var(--panel); border: 1px solid var(--line); font-size: 14px; }
.chip { border: 1px solid var(--line); padding: 0 8px; background: var(--accent-weak); }
.chip-edit { background: var(--accent); font-weight: bold; }
.chip-warn { background: var(--pink); font-weight: bold; }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
button {
  font: inherit; padding: 3px 12px; cursor: pointer; color: var(--text);
  background: var(--panel); border: 2px solid var(--line); border-radius: 0;
}
button.primary { background: var(--accent-weak); }
button:active { color: var(--text); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent-deep); outline-offset: 1px; }
button:disabled { cursor: not-allowed; border-style: dashed; color: #777; }
input[type=text], input[type=password], input[type=number] { font: inherit; border: 1px solid var(--line); padding: 2px 6px; background: #fff; }
.tabs { display: flex; flex-wrap: wrap; gap: 0; border-bottom: 2px solid var(--line); margin-top: 8px; }
.tab { border-bottom: none; margin-right: -2px; background: var(--bg); }
.tab-on { background: var(--accent-weak); font-weight: bold; text-decoration: underline; }
.panel { background: var(--panel); border: 1px solid var(--line); padding: 12px 16px; margin: 12px 0; overflow-x: auto; }
.panel h2 { font-size: 17px; margin: 0 0 8px; }
.panel h3 { font-size: 15px; margin: 16px 0 6px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { border: 1px solid var(--line); padding: 3px 8px; text-align: left; vertical-align: top; }
th { background: var(--accent-weak); position: sticky; top: 0; }
.note { color: var(--muted); font-size: 13px; }
.warn-text { color: var(--pink-deep); font-weight: bold; }
dialog.dlg { border: 2px solid var(--line); padding: 16px 20px; max-width: 640px; background: var(--panel); color: var(--text); }
dialog.dlg::backdrop { background: rgba(40, 40, 40, 0.35); }
dialog.dlg h2 { font-size: 17px; margin: 0 0 8px; border-bottom: 2px solid var(--accent); }
.dlg-buttons { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; margin-top: 12px; }
th.sortable { cursor: pointer; }
th[aria-sort="ascending"]::after { content: " ▲"; }
th[aria-sort="descending"]::after { content: " ▼"; }
.print-only { display: none; }
@page { margin: 14mm 12mm 18mm; @bottom-right { content: "第 " counter(page) " 頁／共 " counter(pages) " 頁"; font-size: 9pt; } }
@media print {
  .toolbar, .tabs, button, .filters, .pager, dialog { display: none !important; }
  .statusbar, th { position: static; }
  .print-only { display: block; position: fixed; bottom: 0; left: 0; right: 0; font-size: 9pt; border-top: 1px solid var(--line); background: #fff; padding: 2px 0; }
  body { background: #fff; }
}
.form { display: grid; gap: 6px; }
.form-row { display: grid; grid-template-columns: 9em 1fr; gap: 8px; align-items: start; }
.form-label { padding-top: 3px; }
.form-input textarea, .form-input select { font: inherit; border: 1px solid var(--line); max-width: 100%; }
.checks { display: flex; flex-direction: column; gap: 2px; max-height: 14em; overflow-y: auto; }
.filters { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin: 6px 0; }
.filters select, .filters input { font: inherit; border: 1px solid var(--line); }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--accent-weak); }
.badge { display: inline-block; border: 1px solid var(--line); padding: 0 6px; margin-right: 6px; font-size: 13px; }
.badge-expert { background: var(--pink); }
.badge-joint { background: var(--accent); }
.badge-old { text-decoration: line-through; background: var(--bg); }
.timeline { border-left: 4px solid var(--accent); padding-left: 12px; margin: 8px 0; }
.tl-item { border: 1px solid var(--line); padding: 8px 12px; margin: 8px 0; background: var(--panel); }
.tl-item h4 { margin: 0 0 4px; font-size: 15px; }
.kv { display: grid; grid-template-columns: 9em 1fr; gap: 2px 12px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.pager { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
@media (max-width: 640px) { .form-row, .kv { grid-template-columns: 1fr; } }
.rule-editor { margin: 8px 0; }
.rule-group { border: 1px solid var(--line); border-left: 4px solid var(--accent); padding: 6px 10px; margin: 6px 0; background: var(--panel); }
.rule-not { border-left-color: var(--pink-deep); background: var(--pink); }
.rule-manual { border-left-color: var(--warn, #6b5413); }
.rule-leaf { border: 1px dashed var(--line); padding: 4px 8px; margin: 4px 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start; }
.rule-leaf select, .rule-leaf input, .rule-leaf textarea, .rule-group select { font: inherit; border: 1px solid var(--line); }
.rule-bad { background: var(--pink); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
.chip-x { padding: 0 4px; margin: 0 0 0 4px; border-width: 1px; }
.pick-list { display: flex; flex-direction: column; max-height: 14em; overflow-y: auto; }
.pick-item { text-align: left; border-width: 1px; margin: 1px 0; }
.rule-desc pre, details pre { background: var(--bg); border: 1px solid var(--line); padding: 6px; white-space: pre-wrap; font-size: 13px; }
.warn-list { margin: 6px 0; }
.rule-text { background: var(--bg); border: 1px solid var(--line); padding: 6px; white-space: pre-wrap; font-size: 13px; }
.alert { border: 2px solid var(--pink-deep); background: var(--pink); padding: 8px 12px; margin: 8px 0; }
.panel.current { border-left: 6px solid var(--accent-deep); }

</style>

<script>
"use strict";
// ---- ui/dom.js ----
const __m_ui_dom_js = (function () {
// 極小DOM輔助：一律以 textContent 放文字，不用 innerHTML。
function h(tag, props, ...children) {
  const el = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v === undefined || v === null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'on') for (const [ev, fn] of Object.entries(v)) el.addEventListener(ev, fn);
      else if (k === 'style') el.setAttribute('style', v);
      else if (k in el && typeof v !== 'string') el[k] = v;
      else el.setAttribute(k, v === true ? '' : String(v));
    }
  }
  append(el, children);
  return el;
}

function append(el, children) {
  for (const c of children) {
    if (c === null || c === undefined || c === false) continue;
    if (Array.isArray(c)) append(el, c);
    else if (c instanceof Node) el.appendChild(c);
    else el.appendChild(document.createTextNode(String(c)));
  }
}

function clear(el) {
  while (el.firstChild) el.removeChild(el.firstChild);
  return el;
}

function table(headers, rows) {
  const t = h('table', null,
    h('thead', null, h('tr', null, headers.map((x) => h('th', { text: x })))),
    h('tbody', null, rows.map((r) => h('tr', null, r.map((c) => (c instanceof Node ? h('td', null, c) : h('td', { text: c === null || c === undefined ? '' : String(c) })))))));
  return sortable(t);
}

// 表頭點選排序（只重排目前畫面已顯示之列，不暗中載入或選取未顯示資料）；數值欄依數值、其餘依文字
const NUM = /^-?\d+(\.\d+)?$/;
function sortable(t) {
  const ths = [...t.querySelectorAll('thead th')];
  ths.forEach((th, i) => {
    th.classList.add('sortable');
    th.setAttribute('tabindex', '0');
    th.title = '點選依此欄排序';
    const go = () => {
      const dir = th.getAttribute('aria-sort') === 'ascending' ? 'descending' : 'ascending';
      ths.forEach((x) => x.removeAttribute('aria-sort'));
      th.setAttribute('aria-sort', dir);
      const body = t.querySelector('tbody');
      const rows = [...body.children];
      const key = (tr) => (tr.children[i] ? tr.children[i].textContent.trim() : '');
      rows.sort((a, b) => {
        const x = key(a); const y = key(b);
        const c = NUM.test(x.replace(/,/g, '')) && NUM.test(y.replace(/,/g, '')) ? Number(x.replace(/,/g, '')) - Number(y.replace(/,/g, '')) : x.localeCompare(y, 'zh-Hant');
        return dir === 'ascending' ? c : -c;
      });
      for (const r of rows) body.appendChild(r);
    };
    th.addEventListener('click', go);
    th.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  });
  return t;
}

// 模態對話框；buttons：[{label, value, primary}]；回傳 Promise<value>（Esc→null）
function dialog(title, body, buttons) {
  return new Promise((resolve) => {
    const dlg = h('dialog', { class: 'dlg', 'aria-label': title });
    const done = (v) => { dlg.close(); dlg.remove(); resolve(v); };
    dlg.appendChild(h('h2', { text: title }));
    dlg.appendChild(h('div', { class: 'dlg-body' }, body));
    const bar = h('div', { class: 'dlg-buttons' });
    for (const b of buttons) {
      bar.appendChild(h('button', { type: 'button', class: b.primary ? 'primary' : '', text: b.label, on: { click: () => {
        if (b.validate && !b.validate()) return;
        done(b.value);
      } } }));
    }
    dlg.appendChild(bar);
    dlg.addEventListener('cancel', (e) => { e.preventDefault(); done(null); });
    document.body.appendChild(dlg);
    dlg.showModal();
  });
}

function alertBox(title, ...lines) {
  return dialog(title, lines.map((l) => (l instanceof Node ? l : h('p', { text: l }))), [{ label: '確定', value: true, primary: true }]);
}

return { h, clear, table, sortable, dialog, alertBox };
})();

// ---- ui/files.js ----
const __m_ui_files_js = (function () {
// 使用者觸發之另存／下載。以另存對話框帶入預設檔名為主；不支援時改用下載。
async function saveTextAs(suggestedName, text, mime = 'application/json') {
  const blob = new Blob([text], { type: mime + ';charset=utf-8' });
  return saveBlobAs(suggestedName, blob);
}

async function saveBlobAs(suggestedName, blob) {
  if (typeof window.showSaveFilePicker === 'function') {
    let fh;
    try {
      fh = await window.showSaveFilePicker({ suggestedName });
    } catch (e) {
      if (e && e.name === 'AbortError') return { saved: false, cancelled: true };
      throw e;
    }
    const w = await fh.createWritable();
    try {
      await w.write(blob);
      await w.close();
    } catch (e) {
      try { await w.abort(); } catch (e2) { /* 忽略 */ }
      throw e;
    }
    return { saved: true, name: fh.name, method: 'saveAs' };
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = suggestedName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  return { saved: true, name: suggestedName, method: 'download' };
}

return { saveTextAs, saveBlobAs };
})();

// ---- core/selfcheck.js ----
const __m_core_selfcheck_js = (function () {
// 啟動自檢（第4.3節）。env 為瀏覽器全域物件（測試時可傳假物件）。
function selfCheck(env) {
  const items = [];
  const add = (key, label, ok, effect, detail) => items.push({ key, label, ok: !!ok, effect, detail: detail || '' });
  const secure = !!env.isSecureContext;
  const crypto = env.crypto;
  const subtle = !!(crypto && crypto.subtle && typeof crypto.subtle.digest === 'function');
  const uuid = !!(crypto && typeof crypto.randomUUID === 'function');
  const fsAccess = typeof env.showDirectoryPicker === 'function';
  const saveAs = typeof env.showSaveFilePicker === 'function';
  const idb = !!env.indexedDB;
  const locks = !!(env.navigator && env.navigator.locks && typeof env.navigator.locks.request === 'function');
  const worker = typeof env.Worker === 'function';
  add('secure', '安全環境（isSecureContext）', secure, '停用編輯');
  add('subtle', 'crypto.subtle（SHA-256）', subtle, '停用編輯');
  add('uuid', 'crypto.randomUUID（主鍵）', uuid, '停用編輯');
  add('fsAccess', '檔案系統存取（showDirectoryPicker）', fsAccess, '唯讀模式：僅能開啟備份zip查詢及匯出');
  add('idb', 'IndexedDB（記住資料夾授權、當機復原草稿）', idb, '可編輯，但無當機復原');
  add('locks', 'navigator.locks（防止同瀏覽器兩分頁同時編輯）', locks, '可編輯，但請勿開兩分頁');
  add('saveAs', '另存對話框（showSaveFilePicker）', saveAs, '匯出改用瀏覽器下載，檔名可能無法帶入');
  add('worker', 'Web Worker', worker, '大量匯入時畫面可能停頓');
  const reasons = [];
  if (!secure) reasons.push('非安全環境');
  if (!subtle) reasons.push('無法計算SHA-256');
  if (!uuid) reasons.push('無法產生UUID');
  const canFolder = secure && subtle && uuid && fsAccess;
  if (!fsAccess) reasons.push('瀏覽器不支援檔案系統存取');
  return {
    items,
    caps: { secure, subtle, uuid, fsAccess, saveAs, idb, locks, worker },
    canEdit: canFolder,
    canFolder,
    readonlyReasons: reasons,
  };
}

return { selfCheck };
})();

// ---- core/errors.js ----
const __m_core_errors_js = (function () {
// 業務／協定錯誤：code 供程式判斷，message 為繁體中文說明（第11.2節）。
class SpecError extends Error {
  constructor(code, message, detail) {
    super(message);
    this.name = 'SpecError';
    this.code = code;
    this.detail = detail === undefined ? null : detail;
  }
}

function errText(e) {
  if (!e) return '未知錯誤';
  if (e instanceof SpecError) return e.message;
  return (e.name ? e.name + '：' : '') + (e.message || String(e));
}

return { SpecError, errText };
})();

// ---- core/util.js ----
const __m_core_util_js = (function () {
// 共用小工具：時間格式、雜湊、穩定序列化。不碰DOM。

function pad(n, w = 2) {
  return String(n).padStart(w, '0');
}

function isoUtc(ms) {
  return new Date(ms).toISOString();
}

// 20261018T024501Z（版本檔名用，UTC）
function compactUtc(ms) {
  const d = new Date(ms);
  return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + 'T' +
    pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + 'Z';
}

// Asia/Taipei 固定 UTC+8（台灣無日光節約時間）
function taipei(ms) {
  const d = new Date(ms + 8 * 3600 * 1000);
  return {
    y: d.getUTCFullYear(), mo: pad(d.getUTCMonth() + 1), d: pad(d.getUTCDate()),
    h: pad(d.getUTCHours()), mi: pad(d.getUTCMinutes()), s: pad(d.getUTCSeconds()),
  };
}

function taipeiDisplay(ms) {
  if (ms === null || ms === undefined || Number.isNaN(ms)) return '';
  const t = taipei(ms);
  return `${t.y}-${t.mo}-${t.d} ${t.h}:${t.mi}:${t.s}`;
}

function taipeiHM(ms) {
  const t = taipei(ms);
  return `${t.h}:${t.mi}`;
}

// 20261018-124805（匯出檔名用，第11.5節）
function taipeiCompact(ms) {
  const t = taipei(ms);
  return `${t.y}${t.mo}${t.d}-${t.h}${t.mi}${t.s}`;
}

function parseIso(s) {
  const v = Date.parse(s);
  return Number.isNaN(v) ? null : v;
}

function hex(buf) {
  const b = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
  let s = '';
  for (let i = 0; i < b.length; i++) s += (b[i] < 16 ? '0' : '') + b[i].toString(16);
  return s;
}

function fromHex(s) {
  const out = new Uint8Array(s.length / 2);
  for (let i = 0; i < out.length; i++) out[i] = parseInt(s.substr(i * 2, 2), 16);
  return out;
}

function utf8(text) {
  return new TextEncoder().encode(text);
}

async function sha256Bytes(bytes) {
  return hex(await globalThis.crypto.subtle.digest('SHA-256', bytes));
}

async function sha256Text(text) {
  return sha256Bytes(utf8(text));
}

function newId() {
  return globalThis.crypto.randomUUID();
}

function randomHex(nBytes) {
  const b = new Uint8Array(nBytes);
  globalThis.crypto.getRandomValues(b);
  return hex(b);
}

// 鍵排序之JSON，供雜湊鏈計算
function stableStringify(v) {
  if (v === null || typeof v !== 'object') return JSON.stringify(v === undefined ? null : v);
  if (Array.isArray(v)) return '[' + v.map(stableStringify).join(',') + ']';
  const keys = Object.keys(v).filter((k) => v[k] !== undefined).sort();
  return '{' + keys.map((k) => JSON.stringify(k) + ':' + stableStringify(v[k])).join(',') + '}';
}

function deepClone(v) {
  return v === undefined ? undefined : JSON.parse(JSON.stringify(v));
}

function revLabel(rev) {
  return 'r' + pad(rev, 6);
}

return { pad, isoUtc, compactUtc, taipeiDisplay, taipeiHM, taipeiCompact, parseIso, hex, fromHex, utf8, sha256Bytes, sha256Text, newId, randomHex, stableStringify, deepClone, revLabel };
})();

// ---- core/paths.js ----
const __m_core_paths_js = (function () {
// 資料夾結構（第4.4節）。所有檔名由程式產生並以白名單驗證；不以使用者輸入組成路徑。
const { SpecError } = __m_core_errors_js;
const { pad, compactUtc } = __m_core_util_js;
const P = {
  META: 'specdrug.json',
  TOKEN: 'control/editing.json',
  KEYWORD: 'control/keyword.json',
  CURRENT: 'data/current.json',
  VERSIONS: 'data/versions',
  EXPORT_LOG: 'logs/export-log.jsonl',
};

const FILE_PATTERNS = [
  /^specdrug\.json$/,
  /^control\/editing\.json$/,
  /^control\/keyword\.json$/,
  /^control\/_writetest-[0-9a-f-]{36}\.tmp$/,
  /^data\/current\.json$/,
  /^data\/versions\/r\d{6}-\d{8}T\d{6}Z-[0-9a-f]{8}\.json$/,
  /^masters\/[0-9a-f-]{36}\.json$/,
  /^attachments\/[0-9a-f]{2}\/[0-9a-f]{64}$/,
  /^logs\/export-log\.jsonl$/,
];

const DIR_PATTERNS = [/^$/, /^control$/, /^data$/, /^data\/versions$/, /^masters$/, /^attachments$/, /^attachments\/[0-9a-f]{2}$/, /^backups$/, /^logs$/];

function isValidPath(p) {
  return typeof p === 'string' && FILE_PATTERNS.some((re) => re.test(p));
}

function assertPath(p) {
  if (!isValidPath(p)) throw new SpecError('BAD_PATH', `不允許的檔案路徑：${p}`);
  return p;
}

function assertDir(d) {
  if (typeof d !== 'string' || !DIR_PATTERNS.some((re) => re.test(d))) {
    throw new SpecError('BAD_PATH', `不允許的資料夾路徑：${d}`);
  }
  return d;
}

function versionFileName(revision, ms, sha256) {
  return `r${pad(revision, 6)}-${compactUtc(ms)}-${sha256.slice(0, 8)}.json`;
}

const VERSION_RE = /^r(\d{6})-(\d{8}T\d{6}Z)-([0-9a-f]{8})\.json$/;

function parseVersionFileName(name) {
  const m = VERSION_RE.exec(name);
  if (!m) return null;
  return { name, revision: Number(m[1]), stamp: m[2], sha8: m[3] };
}

function attachmentPath(sha256) {
  if (!/^[0-9a-f]{64}$/.test(sha256)) throw new SpecError('BAD_PATH', '附件雜湊格式錯誤');
  return `attachments/${sha256.slice(0, 2)}/${sha256}`;
}

function masterPath(importId) {
  return assertPath(`masters/${importId}.json`);
}

return { P, isValidPath, assertPath, assertDir, versionFileName, parseVersionFileName, attachmentPath, masterPath };
})();

// ---- core/version.js ----
const __m_core_version_js = (function () {
// 程式版本與資料結構版本（第11.5節）。建置腳本替換 __BUILD_DATE__、__COMMIT__。

const __m_core_audit_js = (function () {

const { sha256Text, stableStringify } = __m_core_util_js;
const GENESIS_HASH = '0'.repeat(64);

async function hashEvent(ev) {
  const rest = { ...ev };
  delete rest.hash;
  return sha256Text(stableStringify(rest));
}

// drafts：尚未封存的事件；接在 prev 之後計算 seq、prev_hash、hash
async function sealEvents(prev, drafts) {
  const out = prev.slice();
  let last = prev.length ? prev[prev.length - 1].hash : GENESIS_HASH;
  for (const d of drafts) {
    const ev = { ...d, seq: out.length + 1, prev_hash: last };
    delete ev.hash;
    ev.hash = await hashEvent(ev);
    last = ev.hash;
    out.push(ev);
  }
  return out;
}

async function verifyChain(events) {
  if (!Array.isArray(events)) return { ok: false, index: -1, reason: '稽核紀錄格式錯誤' };
  let last = GENESIS_HASH;
  for (let i = 0; i < events.length; i++) {
    const ev = events[i];
    if (!ev || ev.seq !== i + 1) {
      return { ok: false, index: i, seq: ev && ev.seq, reason: `第 ${i + 1} 筆序號不連續（記載 ${ev && ev.seq}）` };
    }
    if (ev.prev_hash !== last) {
      return { ok: false, index: i, seq: ev.seq, reason: `第 ${ev.seq} 筆前一筆雜湊不符（中間紀錄可能被刪除或修改）` };
    }
    const h = await hashEvent(ev);
    if (h !== ev.hash) {
      return { ok: false, index: i, seq: ev.seq, reason: `第 ${ev.seq} 筆內容雜湊不符（紀錄可能被修改）` };
    }
    last = ev.hash;
  }
  return { ok: true, count: events.length, head: last };
}

  return { count: events.length, hash: events.length ? events[events.length - 1].hash : GENESIS_HASH };
}

function isPrefixOf(oldEvents, newEvents) {
  if (newEvents.length < oldEvents.length) return false;
  for (let i = 0; i < oldEvents.length; i++) {
    if (oldEvents[i].hash !== newEvents[i].hash) return false;
  }
  return true;
}

const __m_core_keyword_js = (function () {
// 強制收回關鍵詞（第4.6節第10點）：只存加鹽雜湊，不存明文。
const { SpecError } = __m_core_errors_js;
const { P } = __m_core_paths_js;
const { hex, fromHex, utf8, randomHex, isoUtc } = __m_core_util_js;
const DEFAULT_ITERATIONS = 200000;
const MIN_KEYWORD_LENGTH = 4;

async function deriveKeyword(keyword, saltHex, iterations) {
  const subtle = globalThis.crypto.subtle;
  const key = await subtle.importKey('raw', utf8(keyword), 'PBKDF2', false, ['deriveBits']);
  const bits = await subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: fromHex(saltHex), iterations }, key, 256);
  return hex(bits);
}

function checkNewKeyword(k) {
  if (typeof k !== 'string' || k.trim().length < MIN_KEYWORD_LENGTH) {
    throw new SpecError('BAD_KEYWORD', `關鍵詞至少 ${MIN_KEYWORD_LENGTH} 個字`);
  }
}

async function buildKeywordRecord(keyword, { now, by, iterations = DEFAULT_ITERATIONS }) {
  checkNewKeyword(keyword);
  const salt = randomHex(16);
  return {
    format: 'specdrug-keyword',
    algorithm: 'PBKDF2-SHA256',
    iterations,
    salt,
    hash: await deriveKeyword(keyword, salt, iterations),
    set_at: isoUtc(now),
    set_by: by,
  };
}

async function readKeywordRecord(fs) {
  const r = await fs.read(P.KEYWORD);
  if (!r) return null;
  let rec;
  try { rec = JSON.parse(r.text); } catch (e) { throw new SpecError('KEYWORD_BAD', '關鍵詞檔格式錯誤'); }
  if (!rec || rec.format !== 'specdrug-keyword' || !rec.salt || !rec.hash) throw new SpecError('KEYWORD_BAD', '關鍵詞檔格式錯誤');
  return rec;
}

async function verifyKeyword(fs, keyword) {
  const rec = await readKeywordRecord(fs);
  if (!rec) throw new SpecError('KEYWORD_MISSING', '尚未設定關鍵詞（control/keyword.json 不存在）');
  const h = await deriveKeyword(String(keyword || ''), rec.salt, rec.iterations);
  let diff = 0;
  for (let i = 0; i < h.length; i++) diff |= h.charCodeAt(i) ^ rec.hash.charCodeAt(i);
  return diff === 0 && h.length === rec.hash.length;
}

async function writeKeyword(fs, keyword, opts) {
  const rec = await buildKeywordRecord(keyword, opts);
  await fs.write(P.KEYWORD, JSON.stringify(rec, null, 2));
  return rec;
}

// 修改須輸入原關鍵詞
async function changeKeyword(fs, oldKeyword, newKeyword, opts) {
  if (!(await verifyKeyword(fs, oldKeyword))) throw new SpecError('KEYWORD_WRONG', '原關鍵詞不正確');
  return writeKeyword(fs, newKeyword, opts);
}

// 分頁內連續輸錯鎖定（預設5次／30秒）
class KeywordGuard {
  constructor({ clock, maxFail = 5, lockMs = 30000 }) {
    this.clock = clock;
    this.maxFail = maxFail;
    this.lockMs = lockMs;
    this.fails = 0;
    this.lockedUntil = 0;
  }

  status() {
    const now = this.clock.now();
    if (now < this.lockedUntil) return { locked: true, remainMs: this.lockedUntil - now };
    return { locked: false, remaining: this.maxFail - this.fails };
  }

  record(ok) {
    if (ok) { this.fails = 0; return this.status(); }
    this.fails += 1;
    if (this.fails >= this.maxFail) {
      this.lockedUntil = this.clock.now() + this.lockMs;
      this.fails = 0;
    }
    return this.status();
  }
}

return { DEFAULT_ITERATIONS, MIN_KEYWORD_LENGTH, deriveKeyword, buildKeywordRecord, readKeywordRecord, verifyKeyword, writeKeyword, changeKeyword, KeywordGuard };
})();

// 讀取並驗證一個版本檔。expect：{sha256, revision, save_id}（由current.json提供時）
async function loadVersion(fs, name, { meta, expect } = {}) {
  const errors = [];
  const readonly = [];
  const parsed = parseVersionFileName(name);
  if (!parsed) {
    errors.push({ code: 'VERSION_NAME', message: `版本檔名格式錯誤：${name}` });
    return { ok: false, errors, readonly };
  }
  const path = assertPath(`${P.VERSIONS}/${name}`);
  const r = await fs.read(path);
  if (!r) {
    errors.push({ code: 'VERSION_MISSING', message: `找不到版本檔：${name}` });
    return { ok: false, errors, readonly };
  }
  const sha256 = await sha256Text(r.text);
  if (expect && expect.sha256 && sha256 !== expect.sha256) {
    errors.push({ code: 'VERSION_HASH', message: `版本檔 ${name} 的SHA-256與 current.json 記載不符（檔案可能被修改）`, where: name });
  }
  if (sha256.slice(0, 8) !== parsed.sha8) {
    errors.push({ code: 'VERSION_HASH', message: `版本檔 ${name} 的SHA-256與檔名不符（檔案可能被修改）`, where: name });
  }
  let file;
  try {
    file = JSON.parse(r.text);
  } catch (e) {
    errors.push({ code: 'VERSION_JSON', message: `版本檔 ${name} 不是有效的JSON`, where: name });
    return { ok: false, errors, readonly, sha256 };
  }
  const h = file && file.header;
  if (!h || h.format !== DATA_FORMAT || !file.data || !Array.isArray(file.audit)) {
    errors.push({ code: 'VERSION_FORMAT', message: `版本檔 ${name} 格式錯誤`, where: name });
    return { ok: false, errors, readonly, sha256 };
  }
  if (h.revision !== parsed.revision) errors.push({ code: 'VERSION_REV', message: `版本檔 ${name} 內記載revision ${h.revision} 與檔名不符`, where: name });
  if (expect && expect.revision !== undefined && h.revision !== expect.revision) {
    errors.push({ code: 'VERSION_REV', message: `版本檔revision ${h.revision} 與 current.json 記載 ${expect.revision} 不符`, where: name });
  }
  if (expect && expect.save_id && h.save_id !== expect.save_id) {
    errors.push({ code: 'VERSION_SAVEID', message: '版本檔save_id與 current.json 記載不符', where: name });
  }
  if (meta && h.folder_id !== meta.folder_id) {
    errors.push({ code: 'VERSION_FOLDER', message: '版本檔不屬於此資料夾（folder_id不符）', where: name });
  }
  if (typeof h.schema_version !== 'number') {
    errors.push({ code: 'VERSION_FORMAT', message: '版本檔缺資料結構版本', where: name });
  } else if (h.schema_version > SCHEMA_VERSION) {
    readonly.push(`資料結構版本 ${h.schema_version} 新於本程式（${SCHEMA_VERSION}），只可唯讀，請更新程式`);
  } else if (h.schema_version < SCHEMA_VERSION) {
    errors.push({ code: 'SCHEMA_OLD', message: `資料結構版本 ${h.schema_version} 較舊，須先執行資料結構升級`, where: name });
  }

  if (!chain.ok) {
    errors.push({ code: 'AUDIT_CHAIN', message: `稽核雜湊鏈中斷：${chain.reason}`, where: `${name} 稽核第 ${chain.index + 1} 筆` });

    errors.push({ code: 'AUDIT_HEAD', message: `稽核筆數或末筆雜湊與檔頭記載不符（末端紀錄可能被刪除）：記載 ${h.audit_head && h.audit_head.count} 筆，實有 ${chain.count} 筆`, where: name });
  }
  return { ok: errors.length === 0, errors, readonly, sha256, header: h, data: file.data, audit: file.audit, name };
}

// ---------- 操作情境 ----------
// ctx：{actor:'員編／電腦', now:'ISO', newId:()=>uuid, events:[]}（events 由 session 轉為稽核紀錄）
function actorText(session) {
  return `${session.user}／${session.pc}`;
}

function schemaOf(coll) {
  const s = SCHEMA[coll];
  if (!s) throw new SpecError('NO_COLLECTION', `未知的資料集合：${coll}`);
  return s;
}

function list(data, coll) {
  schemaOf(coll);
  return data.collections[coll] || (data.collections[coll] = []);
}

function find(data, coll, id) {
  return list(data, coll).find((r) => r.id === id) || null;
}

function must(data, coll, id) {
  const r = find(data, coll, id);
  if (!r) throw new SpecError('NOT_FOUND', `找不到${schemaOf(coll).label}（${id}）`);
  return r;
}

// 單一欄位值檢查與正規化
function coerce(coll, name, def, v) {
  const label = `${schemaOf(coll).label}.${name}`;
  if (v === undefined || v === null || v === '') return def.t === 'bool' ? !!v : null;
  switch (def.t) {
    case 'text': return String(v);
    case 'date': {
      if (!isIsoDate(v)) throw new SpecError('BAD_VALUE', `${label} 日期須為 YYYY-MM-DD：${v}`);
      return v;
    }
    case 'money': {
      const m = normalizeMoney(v);
      if (m === null) throw new SpecError('BAD_VALUE', `${label} 金額格式錯誤：${v}`);
      return m;
    }
    case 'int': {
      if (!Number.isInteger(v)) throw new SpecError('BAD_VALUE', `${label} 須為整數：${v}`);
      return v;
    }
    case 'bool': return !!v;
    case 'json': return JSON.parse(JSON.stringify(v));
    case 'code': {
      const { code, error } = normalizeCode(v);
      if (error) throw new SpecError('BAD_CODE', `${label}：${error}`);
      return code;
    }
    case 'enum': {
      if (!def.e.includes(v)) throw new SpecError('BAD_VALUE', `${label} 須為：${def.e.join('／')}（收到「${v}」）`);
      return v;
    }
    case 'ref': return String(v);
    default: throw new SpecError('BAD_SCHEMA', `未知型別 ${def.t}`);
  }
}

function checkRef(data, coll, name, def, v) {
  if (def.t === 'ref' && v !== null && !find(data, def.r, v)) {
    throw new SpecError('BAD_REF', `${schemaOf(coll).label}.${name} 參照之${schemaOf(def.r).label}不存在（${v}）`);
  }
}

function checkUnique(data, coll, rec) {
  for (const keys of schemaOf(coll).unique || []) {
    const dup = list(data, coll).find((r) => r.id !== rec.id && keys.every((k) => r[k] === rec[k]));
    if (dup) throw new SpecError('DUPLICATE', `${schemaOf(coll).label}重複：${keys.map((k) => `${k}=${rec[k]}`).join('、')}`);
  }
}

function diffOf(before, after) {
  const out = {};
  for (const k of new Set([...Object.keys(before || {}), ...Object.keys(after || {})])) {
    if (k === 'row_version' || k === 'updated_at' || k === 'updated_by') continue;
    const a = before ? before[k] : undefined;
    const b = after ? after[k] : undefined;
    if (JSON.stringify(a) !== JSON.stringify(b)) out[k] = { from: a === undefined ? null : a, to: b === undefined ? null : b };
  }
  return out;
}

function emit(ctx, coll, id, action, diff, reason) {
  ctx.events.push({ entity: coll, entity_id: id, action, diff, reason: reason || null, op_id: ctx.opId || null });
}

// 建立：保護欄位不得由呼叫端給；確認狀態一律從預設（草稿）開始
function insert(data, ctx, coll, values, { reason, action } = {}) {
  const s = schemaOf(coll);
  const rec = { id: ctx.newId() };
  for (const k of Object.keys(values)) {
    if (PROTECTED.has(k)) throw new SpecError('FIELD_PROTECTED', `${s.label}：欄位 ${k} 只能由專責函式設定`);
    if (!s.fields[k]) throw new SpecError('FIELD_UNKNOWN', `${s.label} 無欄位：${k}`);
  }
  for (const [name, def] of Object.entries(s.fields)) {
    if (name === 'confirmed_by' || name === 'confirmed_at') { rec[name] = null; continue; }
    const v = Object.prototype.hasOwnProperty.call(values, name) ? values[name] : def.def;
    rec[name] = coerce(coll, name, def, v);
    if (def.req && (rec[name] === null || rec[name] === '')) throw new SpecError('REQUIRED', `${s.label}：${name} 必填`);
    checkRef(data, coll, name, def, rec[name]);
  }
  if (s.check) { const m = s.check(rec); if (m) throw new SpecError('BAD_VALUE', `${s.label}：${m}`); }
  rec.created_by = ctx.actor;
  rec.created_at = ctx.now;
  rec.updated_by = ctx.actor;
  rec.updated_at = ctx.now;
  rec.row_version = 1;
  checkUnique(data, coll, rec);
  list(data, coll).push(rec);
  emit(ctx, coll, rec.id, action || '新增', diffOf(null, rec), reason);
  return rec;
}

// 一般修改函式：欄位白名單；保護欄位、建立後不可改欄位、專責欄位一律拒絕；已確認或撤銷之資料無修改入口
function update(data, ctx, coll, id, changes, { expectedVersion, reason, allow } = {}) {
  const s = schemaOf(coll);
  const rec = must(data, coll, id);
  if (expectedVersion !== undefined && expectedVersion !== null && rec.row_version !== expectedVersion) {
    throw new SpecError('VERSION_CONFLICT', '資料已被更新（版本不符），請重新載入核對後再修改；本次修改未寫入');
  }
  if (s.fields.confirm_status && (rec.confirm_status === '已確認' || rec.confirm_status === '撤銷')) {
    throw new SpecError('CONFIRMED_READONLY', `${s.label}已${rec.confirm_status}，不可修改；更正請建立新版本或取代紀錄`);
  }
  const allowSet = new Set(allow || []);
  const before = { ...rec };
  const next = { ...rec };
  for (const [k, v] of Object.entries(changes)) {
    const def = s.fields[k];
    if (PROTECTED.has(k)) throw new SpecError('FIELD_PROTECTED', `${s.label}：欄位 ${k} 不得經一般修改函式改變`);
    if (!def) throw new SpecError('FIELD_UNKNOWN', `${s.label} 無欄位：${k}`);
    if (def.fix) throw new SpecError('FIELD_FIXED', `${s.label}：欄位 ${k} 建立後不可修改；如需改，請撤銷後重建`);
    if (def.edit === false && !allowSet.has(k)) throw new SpecError('FIELD_PROTECTED', `${s.label}：欄位 ${k} 須以專責功能修改`);
    next[k] = coerce(coll, k, def, v);
    if (def.req && (next[k] === null || next[k] === '')) throw new SpecError('REQUIRED', `${s.label}：${k} 必填`);
    checkRef(data, coll, k, def, next[k]);
  }
  if (s.check) { const m = s.check(next); if (m) throw new SpecError('BAD_VALUE', `${s.label}：${m}`); }
  const diff = diffOf(before, next);
  if (!Object.keys(diff).length) return rec;
  next.updated_by = ctx.actor;
  next.updated_at = ctx.now;
  next.row_version = rec.row_version + 1;
  checkUnique(data, coll, next);
  Object.assign(rec, next);
  emit(ctx, coll, id, '修改', diff, reason);
  return rec;
}

const TRANSITIONS = { 草稿: ['待確認', '已確認', '撤銷'], 待確認: ['草稿', '已確認', '撤銷'], 已確認: [], 撤銷: [] };

// 基本收案、歷次會議、議案、決議及逐品項結果（第9.1節、P0）。
// 案件與認定分開；未通過案件也完整保存。專家建議與會議決議分開標示，不相互覆蓋（B12–B15）。
// 函式皆於 session.run() 之資料副本上執行：fn(data, ctx)。
const { SpecError } = __m_core_errors_js;
const { E, insert, update, setDedicated, find, must, list } = __m_core_model_js;
const { parseDate, normalizeCode } = __m_core_values_js;
const APPROVING = ['同意', '附條件同意'];
const CASE_EDITABLE = ['subject', 'applicant', 'request_item', 'recv_date', 'recv_doc_no', 'unit', 'handler', 'status', 'completeness', 'pending_fields', 'notes', 'source_ref'];
const PENDING_LABELS = { recv_date: '收文日', recv_doc_no: '文號', applicant: '申請廠商' };

function txt(v) {
  if (v === null || v === undefined) return null;
  const s = String(v).trim();
  return s ? s : null;
}

// 日期欄：空白→null；無法解析→錯誤（未知請留空並標示待確認）
function dateField(v, label) {
  const s = txt(v);
  if (!s) return null;
  const d = parseDate(s);
  if (!d) throw new SpecError('BAD_DATE', `${label}「${s}」無法解析；未知請留空並標示待確認`);
  return d;
}

function taipeiYear(iso) {
  return new Date(Date.parse(iso) + 8 * 3600 * 1000).getUTCFullYear();
}

function nextCaseNo(data, ctx, prefix = 'SD') {
  const y = taipeiYear(ctx.now);
  const used = new Set(list(data, 'case_record').map((c) => c.case_no));
  let n = list(data, 'case_record').filter((c) => c.case_no.startsWith(`${prefix}${y}-`)).length;
  for (;;) {
    n += 1;
    const no = `${prefix}${y}-${String(n).padStart(4, '0')}`;
    if (!used.has(no)) return no;
  }
}

function missingFields(v) {
  return Object.keys(PENDING_LABELS).filter((k) => !v[k]);
}

function createCase(data, ctx, input) {
  const subject = txt(input.subject);
  if (!subject) throw new SpecError('REQUIRED', '請輸入主旨');
  if (input.prior_case_id) must(data, 'case_record', input.prior_case_id);
  const v = {
    case_no: txt(input.case_no) || nextCaseNo(data, ctx),
    subject,
    applicant: txt(input.applicant),
    request_item: txt(input.request_item),
    recv_date: dateField(input.recv_date, '收文日'),
    recv_doc_no: txt(input.recv_doc_no),
    unit: txt(input.unit),
    handler: txt(input.handler),
    prior_case_id: input.prior_case_id || null,
    source_ref: txt(input.source_ref),
    notes: txt(input.notes),
  };
  if (input.status) {
    if (input.status === '已結案' || input.status === '撤回') throw new SpecError('BAD_VALUE', '結案或撤回請使用「結案」功能並記錄原因與依據');
    v.status = input.status;
  }
  const missing = missingFields(v);
  v.completeness = input.completeness || (missing.length ? '待確認' : '完整');
  v.pending_fields = txt(input.pending_fields) || (missing.length ? missing.join(',') : null);
  const rec = insert(data, ctx, 'case_record', v);
  for (const d of input.drugs || []) addCaseDrug(data, ctx, rec.id, typeof d === 'string' ? { drug_code: d } : d);
  return rec;
}

function updateCase(data, ctx, caseId, changes, opts = {}) {
  const bad = Object.keys(changes).filter((k) => !CASE_EDITABLE.includes(k));
  if (bad.length) throw new SpecError('FIELD_NOT_ALLOWED', `案件不可直接修改：${bad.join('、')}`);
  const c = { ...changes };
  if (c.status === '已結案' || c.status === '撤回') throw new SpecError('BAD_VALUE', '結案或撤回請使用「結案」功能並記錄原因與依據');
  const cur = must(data, 'case_record', caseId);
  if (cur.status === '已結案' || cur.status === '撤回') {
    if (c.status !== undefined) throw new SpecError('CASE_CLOSED', '案件已結案／撤回；再提或重新開案請建立新案並連結前案');
  }
  if ('recv_date' in c) c.recv_date = dateField(c.recv_date, '收文日');
  for (const k of ['subject', 'applicant', 'request_item', 'recv_doc_no', 'unit', 'handler', 'pending_fields', 'notes', 'source_ref']) {
    if (k in c) c[k] = txt(c[k]);
  }
  return update(data, ctx, 'case_record', caseId, c, opts);
}

function addCaseDrug(data, ctx, caseId, { drug_code, drug_name_text, role, note }) {
  must(data, 'case_record', caseId);
  const { code, error } = normalizeCode(drug_code);
  if (error) throw new SpecError('BAD_CODE', `藥品代碼錯誤：${error}`);
  if (list(data, 'case_drug').some((r) => r.case_id === caseId && r.drug_code === code)) {
    throw new SpecError('DUPLICATE', `案件已有品項 ${code}`);
  }
  return insert(data, ctx, 'case_drug', { case_id: caseId, drug_code: code, drug_name_text: txt(drug_name_text), role: txt(role) || '申請品項', note: txt(note) });
}

function findMeeting(data, { meeting_type, name, meeting_date }) {
  return list(data, 'meeting').find((m) => m.meeting_type === meeting_type && m.name === txt(name) && (m.meeting_date || null) === (meeting_date || null)) || null;
}

// 同類型、同名、同日之會議已存在時拒絕，避免每案重複登打（同會議資料共用）
function createMeeting(data, ctx, { meeting_type, name, meeting_date, session_no, notes }) {
  if (!E.MEETING_TYPE.includes(meeting_type)) throw new SpecError('BAD_VALUE', '會議類型須為：' + E.MEETING_TYPE.join('／'));
  const n = txt(name);
  if (!n) throw new SpecError('REQUIRED', '請輸入會議正式名稱');
  const date = dateField(meeting_date, '會議日期');
  const dup = findMeeting(data, { meeting_type, name: n, meeting_date: date });
  if (dup) throw new SpecError('DUPLICATE', `已有同一會議（${dup.name}${dup.meeting_date ? '，' + dup.meeting_date : ''}），請直接選用`, { id: dup.id });
  return insert(data, ctx, 'meeting', { meeting_type, name: n, meeting_date: date, session_no: txt(session_no), notes: txt(notes) });
}

function updateMeeting(data, ctx, id, changes, opts = {}) {
  const allowed = ['name', 'meeting_date', 'session_no', 'notes'];
  const bad = Object.keys(changes).filter((k) => !allowed.includes(k));
  if (bad.length) throw new SpecError('FIELD_NOT_ALLOWED', `會議不可直接修改：${bad.join('、')}`);
  const c = { ...changes };
  if ('meeting_date' in c) c.meeting_date = dateField(c.meeting_date, '會議日期');
  if ('name' in c) { c.name = txt(c.name); if (!c.name) throw new SpecError('REQUIRED', '請輸入會議正式名稱'); }
  return update(data, ctx, 'meeting', id, c, opts);
}

// 同案重提新增議案紀錄，不覆蓋前次；以明確關聯連結案件
function addAgenda(data, ctx, { meeting_id, case_id, agenda_no, subject, proposal, discussion, original_text }) {
  must(data, 'meeting', meeting_id);
  must(data, 'case_record', case_id);
  return insert(data, ctx, 'meeting_agenda', {
    meeting_id, case_id, agenda_no: txt(agenda_no), subject: txt(subject), proposal: txt(proposal),
    discussion: txt(discussion), original_text: txt(original_text),
  });
}

function updateAgenda(data, ctx, id, changes, opts = {}) {
  const allowed = ['agenda_no', 'subject', 'proposal', 'discussion', 'original_text'];
  const bad = Object.keys(changes).filter((k) => !allowed.includes(k));
  if (bad.length) throw new SpecError('FIELD_NOT_ALLOWED', `議案不可直接修改：${bad.join('、')}`);
  return update(data, ctx, 'meeting_agenda', id, changes, opts);
}

function agendaCaseId(data, decisionId) {
  const dec = must(data, 'decision', decisionId);
  return must(data, 'meeting_agenda', dec.agenda_id).case_id;
}

// drugResults：{case_drug_id: 結果 或 {result, conditions, note}}；未列入者不推定
function addDecision(data, ctx, input) {
  const { agenda_id, nature, result } = input;
  must(data, 'meeting_agenda', agenda_id);
  if (!E.NATURE.includes(nature)) throw new SpecError('BAD_VALUE', '結果性質須為「專家建議」或「會議決議」');
  if (!E.RESULT.includes(result)) throw new SpecError('BAD_VALUE', '結果不正確');
  if (result === '其他' && !txt(input.result_text)) throw new SpecError('REQUIRED', '結果為「其他」時須填結果原文說明');
  if (input.supersedes_id) {
    if (!txt(input.correction_reason)) throw new SpecError('REQUIRED', '更正或取代既有決議須填寫原因');
    const old = must(data, 'decision', input.supersedes_id);
    if (old.agenda_id !== agenda_id) throw new SpecError('BAD_REF', '更正之決議須屬同一議案');
    if (list(data, 'decision').some((d) => d.supersedes_id === old.id)) throw new SpecError('DUPLICATE', '此決議已被更正，請更正最新一筆');
  }
  const dec = insert(data, ctx, 'decision', {
    agenda_id, nature, result, result_text: txt(input.result_text), conditions: txt(input.conditions),
    approval_doc_no: txt(input.approval_doc_no), approval_date: dateField(input.approval_date, '核定日期'),
    supersedes_id: input.supersedes_id || null, correction_reason: txt(input.correction_reason),
  }, { action: input.supersedes_id ? '更正決議' : '新增' });
  for (const [cdId, val] of Object.entries(input.drugResults || {})) {
    const v = typeof val === 'string' ? { result: val } : val;
    setDecisionDrug(data, ctx, dec.id, cdId, v);
  }
  return dec;
}

// 逐品項結果；同決議同品項再登錄即修改（Q10暫採：修改留稽核前後差異）
function setDecisionDrug(data, ctx, decisionId, caseDrugId, { result, conditions, note }, opts = {}) {
  if (!E.RESULT.includes(result)) throw new SpecError('BAD_VALUE', '品項結果不正確');
  if (result === '其他' && !txt(note) && !txt(conditions)) throw new SpecError('REQUIRED', '品項結果為「其他」時須說明');
  const cd = must(data, 'case_drug', caseDrugId);
  if (agendaCaseId(data, decisionId) !== cd.case_id) throw new SpecError('BAD_REF', '品項不屬於此議案的案件，不能串接');
  const exist = list(data, 'decision_drug').find((r) => r.decision_id === decisionId && r.case_drug_id === caseDrugId);
  const note2 = txt(note) || (result === '其他' ? txt(conditions) : null);
  if (exist) return update(data, ctx, 'decision_drug', exist.id, { result, conditions: txt(conditions), note: note2 }, opts);
  return insert(data, ctx, 'decision_drug', { decision_id: decisionId, case_drug_id: caseDrugId, result, conditions: txt(conditions), note: note2 });
}

// 結果摘要：須連結形成摘要的決議，由承辦確認；不以最後一次會議日期自動認定
function setCaseSummary(data, ctx, caseId, { summary, decisionIds = [], note, reason }) {
  const c = must(data, 'case_record', caseId);
  if (!E.SUMMARY.includes(summary)) throw new SpecError('BAD_VALUE', '結果摘要不正確');
  if (summary !== '尚無結論' && !decisionIds.length) throw new SpecError('REQUIRED', '結果摘要須連結至少一項會議決議或專家建議作為依據');
  if (summary === '其他' && !txt(note)) throw new SpecError('REQUIRED', '摘要為「其他」時須說明');
  for (const id of decisionIds) {
    if (agendaCaseId(data, id) !== caseId) throw new SpecError('BAD_REF', '所選決議不屬於此案件');
  }
  return setDedicated(data, ctx, 'case_record', c.id, {
    result_summary: summary, result_decision_ids: decisionIds.length ? [...decisionIds] : null, result_summary_note: txt(note),
    result_confirmed_by: ctx.actor, result_confirmed_at: ctx.now,
  }, { action: '確認結果摘要', reason, fields: ['result_summary', 'result_decision_ids', 'result_summary_note', 'result_confirmed_by', 'result_confirmed_at'] });
}

function closeCase(data, ctx, caseId, { status, reason, basis }) {
  const c = must(data, 'case_record', caseId);
  if (status !== '已結案' && status !== '撤回') throw new SpecError('BAD_VALUE', '結案狀態須為「已結案」或「撤回」');
  if (!txt(reason) || !txt(basis)) throw new SpecError('REQUIRED', '結案須記錄原因與依據');
  if (c.status === '已結案' || c.status === '撤回') throw new SpecError('CASE_CLOSED', '案件已結案／撤回');
  return setDedicated(data, ctx, 'case_record', caseId, { status, close_reason: txt(reason), close_basis: txt(basis) },
    { action: status === '撤回' ? '撤回案件' : '結案', reason: txt(reason), fields: ['status', 'close_reason', 'close_basis'] });
}

// 再提或重新開案：新建案件並保留與前案關聯；品項沿用前案（可另增減）
function reopenAsNew(data, ctx, priorCaseId, input = {}) {
  const prior = must(data, 'case_record', priorCaseId);
  const drugs = input.drugs || list(data, 'case_drug').filter((d) => d.case_id === prior.id)
    .map((d) => ({ drug_code: d.drug_code, drug_name_text: d.drug_name_text, role: d.role }));
  return createCase(data, ctx, {
    subject: prior.subject, applicant: prior.applicant, request_item: prior.request_item, unit: prior.unit, handler: prior.handler,
    ...input, drugs, prior_case_id: prior.id,
  });
}

// ---------- 查詢（唯讀） ----------

function meetingOf(data, agenda) {
  return find(data, 'meeting', agenda.meeting_id) || {};
}

// 依序列出各次會議、議案、決議及逐品項結果；日期未知者排最後
function caseTimeline(data, caseId) {
  const agendas = list(data, 'meeting_agenda').filter((a) => a.case_id === caseId).map((a) => {
    const m = meetingOf(data, a);
    const decisions = list(data, 'decision').filter((d) => d.agenda_id === a.id)
      .sort((x, y) => (x.created_at < y.created_at ? -1 : x.created_at > y.created_at ? 1 : 0))
      .map((d) => ({
        ...d,
        superseded: list(data, 'decision').some((z) => z.supersedes_id === d.id),
        drugs: list(data, 'decision_drug').filter((r) => r.decision_id === d.id).map((r) => ({
          ...r, drug_code: (find(data, 'case_drug', r.case_drug_id) || {}).drug_code,
        })).sort((p, q) => (p.drug_code < q.drug_code ? -1 : 1)),
      }));
    return { ...a, meeting_type: m.meeting_type, meeting_name: m.name, meeting_date: m.meeting_date || null, session_no: m.session_no, decisions };
  });
  agendas.sort((a, b) => {
    if (!a.meeting_date !== !b.meeting_date) return a.meeting_date ? -1 : 1;
    if (a.meeting_date !== b.meeting_date) return a.meeting_date < b.meeting_date ? -1 : 1;
    return a.created_at < b.created_at ? -1 : a.created_at > b.created_at ? 1 : 0;
  });
  return agendas;
}

// 可接續認定／調高之依據：未被更正之「會議決議」中，該品項為同意或附條件同意者（專家建議不當最終通過）
function drugFollowupBasis(data, caseId, drugCode) {
  const out = [];
  for (const a of caseTimeline(data, caseId)) {
    for (const d of a.decisions) {
      if (d.nature !== '會議決議' || d.superseded) continue;
      for (const r of d.drugs) {
        if (r.drug_code === drugCode && APPROVING.includes(r.result)) {
          out.push({ decision_id: d.id, result: r.result, conditions: r.conditions, meeting_name: a.meeting_name, meeting_date: a.meeting_date });
        }
      }
    }
  }
  return out;
}

function caseDrugs(data, caseId) {
  return list(data, 'case_drug').filter((d) => d.case_id === caseId).sort((a, b) => (a.drug_code < b.drug_code ? -1 : 1));
}

function listCases(data, { keyword, status, summary, completeness } = {}) {
  const kw = txt(keyword);
  const drugsBy = new Map();
  for (const d of list(data, 'case_drug')) {
    if (!drugsBy.has(d.case_id)) drugsBy.set(d.case_id, []);
    drugsBy.get(d.case_id).push(d.drug_code);
  }
  return list(data, 'case_record').filter((c) => {
    if (status && c.status !== status) return false;
    if (summary && c.result_summary !== summary) return false;
    if (completeness && c.completeness !== completeness) return false;
    if (kw) {
      const hay = [c.case_no, c.subject, c.applicant, c.recv_doc_no, ...(drugsBy.get(c.id) || [])].filter(Boolean).join(' ');
      if (!hay.includes(kw)) return false;
    }
    return true;
  }).map((c) => ({ ...c, drugs: (drugsBy.get(c.id) || []).sort() })).sort((a, b) => {
    if (!a.recv_date !== !b.recv_date) return a.recv_date ? -1 : 1;
    if (a.recv_date !== b.recv_date) return a.recv_date < b.recv_date ? 1 : -1;
    return a.case_no < b.case_no ? 1 : -1;
  });
}

function listMeetings(data, { keyword } = {}) {
  const kw = txt(keyword);
  const counts = new Map();
  for (const a of list(data, 'meeting_agenda')) counts.set(a.meeting_id, (counts.get(a.meeting_id) || 0) + 1);
  return list(data, 'meeting').filter((m) => !kw || [m.name, m.session_no].filter(Boolean).join(' ').includes(kw))
    .map((m) => ({ ...m, agenda_count: counts.get(m.id) || 0 }))
    .sort((a, b) => {
      if (!a.meeting_date !== !b.meeting_date) return a.meeting_date ? -1 : 1;
      return a.meeting_date === b.meeting_date ? 0 : a.meeting_date < b.meeting_date ? 1 : -1;
    });
}

function meetingAgendas(data, meetingId) {
  return list(data, 'meeting_agenda').filter((a) => a.meeting_id === meetingId).map((a) => ({
    ...a, case_no: (find(data, 'case_record', a.case_id) || {}).case_no, case_subject: (find(data, 'case_record', a.case_id) || {}).subject,
  })).sort((a, b) => String(a.agenda_no || '').localeCompare(String(b.agenda_no || ''), 'zh-Hant', { numeric: true }));
}

return { APPROVING, dateField, nextCaseNo, createCase, updateCase, addCaseDrug, findMeeting, createMeeting, updateMeeting, addAgenda, updateAgenda, addDecision, setDecisionDrug, setCaseSummary, closeCase, reopenAsNew, caseTimeline, drugFollowupBasis, caseDrugs, listCases, listMeetings, meetingAgendas };
})();

// ---- ui/casesView.js ----
const __m_ui_casesView_js = (function () {
// 案件清單、案件詳情／會議時間序列、會議清單（第10節）。只呼叫業務模組函式改資料。
const { h, table, dialog } = __m_ui_dom_js;
const { formDialog, opts } = __m_ui_forms_js;
const C = __m_core_cases_js;
const { E, find } = __m_core_model_js;
const { rocDisplay } = __m_core_values_js;
const { newId } = __m_core_util_js;
const PAGE = 100;
const RESULT_OPTS = opts(E.RESULT);

function dateText(iso) {
  return iso ? `${iso}（${rocDisplay(iso)}）` : '（未知）';
}

function natureBadge(nature, superseded) {

    text: (superseded ? '已更正｜' : '') + nature });

function kv(pairs) {

}

function casesTab(env) {

  ui.cases = ui.cases || { filters: {}, page: 0, selected: null };

function data(env) {
  return env.s.mode === 'edit' ? env.s.work : env.s.committed.data;
}

// ---------- 案件清單 ----------
function caseList(env) {
  const { s, ui, btn, guard, render } = env;
  const st = ui.cases;
  const f = st.filters;
  const kw = h('input', { type: 'text', size: 18, value: f.keyword || '', placeholder: '案號、主旨、廠商、文號、藥品代碼', 'aria-label': '關鍵字' });
  const sel = (key, label, list) => h('label', null, label + ' ', h('select', { 'aria-label': label, on: { change: (e) => { f[key] = e.target.value || null; st.page = 0; render(); } } },
    h('option', { value: '', text: '全部' }), list.map((x) => h('option', { value: x, text: x, selected: f[key] === x }))));
  const rows = C.listCases(data(env), f);
  const pageRows = rows.slice(st.page * PAGE, (st.page + 1) * PAGE);
  const box = h('section', { class: 'panel' },
    h('h2', { text: '案件清單' }),
    h('div', { class: 'filters' },
      h('label', null, '關鍵字 ', kw), btn('查詢', () => { f.keyword = kw.value.trim() || null; st.page = 0; render(); }),
      sel('status', '處理狀態', E.CASE_STATUS), sel('summary', '結果摘要', E.SUMMARY), sel('completeness', '完整性', E.COMPLETENESS),
      btn('清除條件', () => { st.filters = {}; st.page = 0; render(); })),
    s.mode === 'edit' ? h('div', { class: 'toolbar' }, btn('新增案件', () => guard(() => newCase(env)), { primary: true })) : null,
    h('p', { class: 'note', text: `共 ${rows.length} 筆；未通過、撤回、辦理中案件一併列出。點選列開啟詳情。` }));
  const t = table(['案號', '收文日', '文號', '主旨', '申請廠商', '品項', '承辦', '處理狀態', '結果摘要', '完整性'], []);
  const tbody = t.querySelector('tbody');
  for (const c of pageRows) {
    const tr = h('tr', { class: 'clickable', tabindex: '0', on: {
      click: () => { st.selected = c.id; render(); },
      keydown: (e) => { if (e.key === 'Enter') { st.selected = c.id; render(); } },
    } }, [c.case_no, c.recv_date || '', c.recv_doc_no || '', c.subject, c.applicant || '', c.drugs.join('、'), c.handler || '', c.status, c.result_summary, c.completeness]
      .map((x) => h('td', { text: x })));
    tbody.appendChild(tr);
  }
  box.appendChild(t);
  if (rows.length > PAGE) {
    const pages = Math.ceil(rows.length / PAGE);
    box.appendChild(h('div', { class: 'pager' },
      btn('上一頁', () => { st.page -= 1; render(); }, { disabled: st.page === 0 }),
      h('span', { text: `第 ${st.page + 1}／${pages} 頁` }),
      btn('下一頁', () => { st.page += 1; render(); }, { disabled: st.page >= pages - 1 })));
  }
  return box;
}

function caseFields(c = {}) {
  return [

    { key: 'applicant', label: '申請廠商', value: c.applicant },

    { key: 'handler', label: '承辦人員', value: c.handler },
    { key: 'notes', label: '備註', type: 'textarea', value: c.notes },

function caseDetail(env, caseId) {
  const { s, ui, btn, guard, render } = env;
  const d = data(env);
  const c = find(d, 'case_record', caseId);
  if (!c) { ui.cases.selected = null; return caseList(env); }
  const editing = s.mode === 'edit';
  const closed = c.status === '已結案' || c.status === '撤回';
  const drugs = C.caseDrugs(d, c.id);
  const prior = c.prior_case_id ? find(d, 'case_record', c.prior_case_id) : null;
  const later = d.collections.case_record.filter((x) => x.prior_case_id === c.id);
  const summaryDecs = (c.result_decision_ids || []).map((id) => find(d, 'decision', id)).filter(Boolean);

  const info = h('section', { class: 'panel' },
    h('div', { class: 'toolbar' }, btn('← 回案件清單', () => { ui.cases.selected = null; render(); })),
    h('h2', { text: `案件 ${c.case_no}：${c.subject}` }),
    c.completeness !== '完整' ? h('p', { class: 'warn-text', text: `資料完整性：${c.completeness}${c.pending_fields ? `（待補：${c.pending_fields}）` : ''}` }) : null,
    kv([
      ['收文日', dateText(c.recv_date)], ['收文文號', c.recv_doc_no], ['申請廠商', c.applicant], ['申請事項', c.request_item],
      ['承辦', [c.unit, c.handler].filter(Boolean).join('／')], ['處理狀態', c.status],
      ['結果摘要', `${c.result_summary}${c.result_summary_note ? `（${c.result_summary_note}）` : ''}`],
      ['摘要依據', summaryDecs.length ? summaryDecs.map((x) => `${x.nature}：${x.result}`).join('；') : null],
      ['摘要確認', c.result_confirmed_by ? `${c.result_confirmed_by}，${c.result_confirmed_at}` : null],
      ['結案', closed ? `${c.status}：${c.close_reason}（依據：${c.close_basis}）` : null],
      ['前案', prior ? h('a', { href: '#', text: `${prior.case_no} ${prior.subject}`, on: { click: (e) => { e.preventDefault(); ui.cases.selected = prior.id; render(); } } }) : null],
      ['後續再提', later.length ? h('span', null, later.map((x) => h('a', { href: '#', text: `${x.case_no} `, on: { click: (e) => { e.preventDefault(); ui.cases.selected = x.id; render(); } } }))) : null],
      ['來源', c.source_ref], ['備註', c.notes],
      ['建立／更新', `${c.created_by}，${c.created_at}／${c.updated_by}，${c.updated_at}（第${c.row_version}版）`],
    ]),
    editing ? h('div', { class: 'toolbar' },
      btn('修改基本資料', () => guard(() => editCase(env, c))),
      btn('確認結果摘要', () => guard(() => confirmSummary(env, c))),
      closed ? null : btn('結案／撤回', () => guard(() => closeCaseUI(env, c))),
      closed ? btn('再提（開新案並連結前案）', () => guard(() => reopenUI(env, c))) : null) : null);

  const drugBox = h('section', { class: 'panel' }, h('h3', { text: '申請品項' }),
    table(['藥品代碼', '品名（原文）', '角色', '可接續之會議決議（同意／附條件同意）'], drugs.map((x) => {
      const basis = C.drugFollowupBasis(d, c.id, x.drug_code);
      return [x.drug_code, x.drug_name_text || '', x.role || '', basis.length ? basis.map((b) => `${b.meeting_name}：${b.result}`).join('；') : '無'];
    })),
    editing && !closed ? h('div', { class: 'toolbar' }, btn('新增品項', () => guard(() => addDrugUI(env, c)))) : null);

  const tl = C.caseTimeline(d, c.id);
  const tlBox = h('section', { class: 'panel' }, h('h3', { text: '會議時間序列' }),
    h('p', { class: 'note', text: '專家建議與共同擬訂會議決議分別標示；同案重提為新議案，不覆蓋前次。未列入某次討論的品項不推定結果。' }),
    tl.length ? null : h('p', { text: '尚無會議紀錄。' }),
    h('div', { class: 'timeline' }, tl.map((a) => h('div', { class: 'tl-item' },
      h('h4', { text: `${a.meeting_date ? `${a.meeting_date}（${rocDisplay(a.meeting_date)}）` : '日期未知'}｜${a.meeting_type}｜${a.meeting_name}${a.session_no ? `（${a.session_no}）` : ''}` }),
      h('p', { text: `議案 ${a.agenda_no || '—'}：${a.subject || ''}` }),
      a.proposal ? h('p', { class: 'note', text: '提案資料：' + a.proposal }) : null,
      a.discussion ? h('p', { class: 'note', text: '討論摘要：' + a.discussion }) : null,
      a.original_text ? h('p', { class: 'note', text: '原文紀錄：' + a.original_text }) : null,
      a.decisions.map((dec) => h('div', { class: 'decision' },
        h('p', null, natureBadge(dec.nature, dec.superseded), h('strong', { text: dec.result }),
          dec.result_text ? '：' + dec.result_text : '', dec.conditions ? `（條件：${dec.conditions}）` : '',
          dec.approval_doc_no ? `｜核定文號 ${dec.approval_doc_no}` : '', dec.approval_date ? `｜核定日 ${dec.approval_date}` : '',
          dec.correction_reason ? `｜更正原因：${dec.correction_reason}` : ''),
        dec.drugs.length ? table(['藥品代碼', '品項結果', '條件', '說明', ''], dec.drugs.map((r) => [r.drug_code, r.result, r.conditions || '', r.note || '',
          editing && !dec.superseded ? btn('修改', () => guard(() => editDrugResult(env, dec, r))) : ''])) : h('p', { class: 'note', text: '未登錄逐品項結果。' }),
        editing && !dec.superseded ? h('div', { class: 'toolbar' },
          btn('補登品項結果', () => guard(() => addDrugResults(env, c, dec))),
          btn('更正此決議', () => guard(() => correctDecision(env, c, a, dec)))) : null)),
      editing ? h('div', { class: 'toolbar' }, btn('新增決議／建議', () => guard(() => newDecision(env, c, a)))) : null))),
    editing ? h('div', { class: 'toolbar' }, btn('新增議案（選會議）', () => guard(() => newAgenda(env, c)), { primary: true })) : null);
  return [info, drugBox, tlBox];
}

async function editCase(env, c) {
  const fields = [...caseFields(c),
    { key: 'status', label: '處理狀態', type: 'select', options: opts(E.CASE_STATUS.filter((x) => x !== '已結案' && x !== '撤回')), value: c.status },
    { key: 'completeness', label: '完整性', type: 'select', options: opts(E.COMPLETENESS), value: c.completeness },
    { key: 'pending_fields', label: '待補欄位', value: c.pending_fields },
    { key: 'reason', label: '修改原因' }];
  if (c.status === '已結案' || c.status === '撤回') fields.splice(fields.findIndex((x) => x.key === 'status'), 1);
  const v = await formDialog('修改案件基本資料', fields);
  if (!v) return;
  const { reason, ...changes } = v;
  if (!changes.unit) changes.unit = null;
  await env.s.run((d, k) => C.updateCase(d, k, c.id, changes, { expectedVersion: c.row_version, reason }));
}

function drugResultFields(drugs, current = {}) {
  return drugs.map((x) => ({ key: 'dr_' + x.id, label: `品項 ${x.drug_code}`, type: 'select', options: [['', '（未列入本次討論）'], ...RESULT_OPTS], value: current[x.id] || '' }));
}

function collectDrugResults(v, drugs) {
  const out = {};
  for (const x of drugs) if (v['dr_' + x.id]) out[x.id] = v['dr_' + x.id];
  return out;
}

async function newDecision(env, c, a, base) {
  const d = data(env);
  const drugs = C.caseDrugs(d, c.id);
  const meeting = find(d, 'meeting', a.meeting_id) || {};
  const defNature = meeting.meeting_type === '專家' ? '專家建議' : '會議決議';
  const fields = [
    { key: 'nature', label: '結果性質', type: 'select', options: opts(E.NATURE), value: base ? base.nature : defNature, required: true },
    { key: 'result', label: '結果', type: 'select', options: RESULT_OPTS, value: base ? base.result : '待確認', required: true },
    { key: 'result_text', label: '結果原文', type: 'textarea', value: base && base.result_text, hint: '結果為「其他」時必填' },
    { key: 'conditions', label: '附帶條件', type: 'textarea', value: base && base.conditions, hint: '附條件同意者，條件內容保存於此（B19：系統不另設達成檢核）' },
    { key: 'approval_doc_no', label: '核定文號', value: base && base.approval_doc_no }, { key: 'approval_date', label: '核定日期', type: 'date', value: base && base.approval_date },
    ...drugResultFields(drugs),
  ];
  if (base) fields.unshift({ key: 'correction_reason', label: '更正原因', required: true });
  const v = await formDialog(base ? '更正決議（新增取代紀錄，原決議保留）' : '新增決議／建議', fields, {
    validate: (x) => (x.result === '其他' && !x.result_text ? '結果為「其他」時須填結果原文' : null),
  });
  if (!v) return;
  const drugResults = collectDrugResults(v, drugs);
  await env.s.run((dd, k) => C.addDecision(dd, k, {
    agenda_id: a.id, nature: v.nature, result: v.result, result_text: v.result_text, conditions: v.conditions,
    approval_doc_no: v.approval_doc_no, approval_date: v.approval_date, drugResults,
    supersedes_id: base ? base.id : null, correction_reason: base ? v.correction_reason : null,
  }));
}

async function correctDecision(env, c, a, dec) {
  await newDecision(env, c, a, dec);
}

async function addDrugResults(env, c, dec) {
  const d = data(env);
  const drugs = C.caseDrugs(d, c.id);
  const cur = Object.fromEntries(dec.drugs.map((r) => [r.case_drug_id, r.result]));
  const v = await formDialog('登錄逐品項結果', [...drugResultFields(drugs, cur), { key: 'reason', label: '修改原因', hint: '修改既有結果時請填' }]);
  if (!v) return;
  const res = collectDrugResults(v, drugs);
  await env.s.run((dd, k) => {
    for (const [cdId, result] of Object.entries(res)) {
      if (cur[cdId] === result) continue;
      C.setDecisionDrug(dd, k, dec.id, cdId, { result }, { reason: v.reason });
    }
  });
}

async function editDrugResult(env, dec, r) {

    { type: 'note', label: 'Q10暫採：逐品項結果可修改，稽核保留修改前後內容。' }]);
  if (!v) return;
  await env.s.run((dd, k) => C.setDecisionDrug(dd, k, dec.id, r.case_drug_id, v, { expectedVersion: r.row_version, reason: v.reason }));
}

async function confirmSummary(env, c) {
  const d = data(env);
  const opId = newId();
  const decs = C.caseTimeline(d, c.id).flatMap((a) => a.decisions.filter((x) => !x.superseded).map((x) => [x.id, `${a.meeting_date || '日期未知'}｜${a.meeting_name}｜${x.nature}：${x.result}`]));
  const v = await formDialog('確認結果摘要', [
    { key: 'summary', label: '結果摘要', type: 'select', options: opts(E.SUMMARY), value: c.result_summary, required: true },
    { key: 'decisionIds', label: '形成摘要之決議', type: 'checks', options: decs, value: c.result_decision_ids || [] },
    { key: 'note', label: '說明', type: 'textarea', value: c.result_summary_note, hint: '摘要為「其他」時必填' },
    { type: 'note', label: '須連結形成摘要的會議決議或專家建議，由承辦確認；系統不以最後一次會議自動認定。專家建議同意不等於最終通過。' },
  ], { okLabel: '下一步', validate: (x) => (x.summary !== '尚無結論' && !x.decisionIds.length ? '請勾選至少一項決議作為依據' : x.summary === '其他' && !x.note ? '摘要為「其他」時須說明' : null) });
  if (!v) return;
  const ok = await dialog('確認', [h('p', { text: `將案件 ${c.case_no} 結果摘要確認為「${v.summary}」，依據 ${v.decisionIds.length} 項決議，確認者 ${env.s.session.user}。` })],
    [{ label: '取消', value: null }, { label: '確認', value: true, primary: true }]);
  if (!ok) return;
  await env.s.run((dd, k) => { C.setCaseSummary(dd, k, c.id, v); return { case_id: c.id }; }, { opId, kind: '確認結果摘要' });
}

// ---------- 會議清單 ----------
function meetingsTab(env) {
  const { s, ui, btn, guard, render } = env;
  ui.meetings = ui.meetings || { keyword: null, selected: null };
  const st = ui.meetings;
  const d = data(env);
  if (st.selected) {
    const m = find(d, 'meeting', st.selected);
    if (m) {
      const ags = C.meetingAgendas(d, m.id);
      return h('section', { class: 'panel' },
        h('div', { class: 'toolbar' }, btn('← 回會議清單', () => { st.selected = null; render(); })),
        h('h2', { text: `${m.meeting_type}｜${m.name}` }),
        kv([['日期', dateText(m.meeting_date)], ['次別', m.session_no], ['備註', m.notes]]),
        s.mode === 'edit' ? h('div', { class: 'toolbar' }, btn('修改會議資料', () => guard(async () => {
          const v = await formDialog('修改會議', [{ key: 'name', label: '正式名稱', value: m.name, required: true }, { key: 'meeting_date', label: '會議日期', type: 'date', value: m.meeting_date },
            { key: 'session_no', label: '次別', value: m.session_no }, { key: 'notes', label: '備註', type: 'textarea', value: m.notes }, { key: 'reason', label: '修改原因' }]);
          if (!v) return;
          const { reason, ...ch } = v;
          await s.run((dd, k) => C.updateMeeting(dd, k, m.id, ch, { expectedVersion: m.row_version, reason }));
        }))) : null,
        h('h3', { text: `議案（${ags.length}）` }),

const TRUE = '符合';
const FALSE = '不符合';
const UNKNOWN = '待確認';

const FIELDS = {
  group_code: { label: '分組代碼', type: 'text', col: 'group_code', name: 'group_name' },
  atc_code: { label: 'ATC碼', type: 'text', col: 'atc_code', name: 'atc_name' },
  dose_code: { label: '核價劑型', type: 'text', col: 'dose_code', name: 'dose_name' },
  multi_mark: { label: '單複方', type: 'text', col: 'multi_mark' },
  drug_code: { label: '藥品代碼', type: 'text', col: 'drug_code', name: 'drug_name' },
  firm_code: { label: '藥商代碼', type: 'text', col: 'firm_code', name: 'firm' },
  firm: { label: '藥商名稱', type: 'text', col: 'firm' },
  ingredient: { label: '成分', type: 'text', col: 'ingredient' },
  spec: { label: '規格', type: 'quantity', col: ['spec_qty', 'spec_unit'] },
  applicant_id: { label: '申請商統編', type: 'text', col: 'applicant_id' },

const LOGIC_OPS = { and: '全部符合', or: '任一符合', not: '排除', same_applicant: '同申請商另有品項符合' };

function err(path, msg) {
  return new SpecError('RULE', `${path}：${msg}`);
}

function only(node, allowed, path) {
  const extra = Object.keys(node).filter((k) => !allowed.includes(k));

function validateRule(node, path = '根') {
  if (!node || typeof node !== 'object' || Array.isArray(node)) throw err(path, '條件格式錯誤');
  const op = node.op;
  if (op === 'and' || op === 'or') {

    node.children.forEach((c, i) => validateRule(c, `${path}/${i + 1}`));
    only(node, ['op', 'children'], path);
    return;
  }
  if (op === 'not') {
    if (!node.child) throw err(path, '排除條件缺少內容');

    only(node, ['op', 'child'], path);
    return;

    if (!node.child) throw err(path, '同申請商條件缺少子條件');

  if (f.type === 'text') {
    if (!TEXT_OPS[op]) throw err(path, `欄位 ${node.field} 不支援運算子 ${JSON.stringify(op)}`);
    if (op === 'in' || op === 'not_in') {
      if (!Array.isArray(node.values) || !node.values.length || !node.values.every((v) => typeof v === 'string' && v.trim())) throw err(path, '清單條件須至少一個文字值');
      only(node, ['op', 'field', 'values'], path);
    } else {
      if (typeof node.value !== 'string' || !node.value.trim()) throw err(path, '條件值須為非空文字');

    }

    if (typeof node.value !== 'string' || normalizeMoney(node.value) === null) throw err(path, '規格數值無法解析');

function fieldsUsed(node, out = new Set()) {

}

function hasManual(node) {
  if (node.op === 'and' || node.op === 'or') return node.children.some(hasManual);
  if (node.op === 'not' || node.op === 'same_applicant') return hasManual(node.child);
  return node.op === 'manual';
}

function canonical(node) {
  return stableStringify(node);
}

function ruleHash(node) {
  return sha256Text(canonical(node));
}

// 三值判定。knownUnits：Set（已正規化）；conversions：{'L|ML': '1000'}（僅經確認者；預設無）
class Evaluator {
  constructor({ knownUnits, conversions } = {}) {
    this.known = new Set([...(knownUnits || [])].map(normUnit));
    this.conv = new Map();
    for (const [k, factor] of Object.entries(conversions || {})) {
      const [a, b] = k.split('|').map(normUnit);
      this.conv.set(`${a}|${b}`, { mul: factor });
      this.conv.set(`${b}|${a}`, { div: factor });
    }
  }

  // 跨品項條件用：主檔列（{byCode}）；依申請商統編建索引
  setRows(rows) {
    this.byApplicant = new Map();
    for (const d of rows.byCode.values()) {
      const k = d.applicant_id ? String(d.applicant_id).trim() : '';
      if (!k) continue;
      if (!this.byApplicant.has(k)) this.byApplicant.set(k, []);
      this.byApplicant.get(k).push(d);
    }
    this.hasApplicant = this.byApplicant.size > 0;
  }

  sameApplicant(node, drug) {
    const k = drug.applicant_id ? String(drug.applicant_id).trim() : '';
    if (!this.byApplicant || !this.hasApplicant) return [UNKNOWN, '申請商統編缺值（主檔版本未匯入藥品許可證檔）'];
    if (!k) return [UNKNOWN, '申請商統編缺值（許可證對應不到）'];
    let unknown = null;
    for (const o of this.byApplicant.get(k) || []) {
      if (o.drug_code === drug.drug_code) continue;
      const [r, p] = this.evaluate(node.child, o);
      if (r === TRUE) return [TRUE, `同申請商（${k}）另有 ${o.drug_code} 符合（${p}）`];
      if (r === UNKNOWN && !unknown) unknown = `同申請商另有品項待確認：${o.drug_code}（${p}）`;
    }
    return unknown ? [UNKNOWN, unknown] : [FALSE, `同申請商（${k}）無其他品項符合`];
  }

  evaluate(node, drug) {
    const op = node.op;
    if (op === 'same_applicant') return this.sameApplicant(node, drug);
    if (op === 'and') {
      const rs = node.children.map((c) => this.evaluate(c, drug));
      const f = rs.find((r) => r[0] === FALSE);
      if (f) return f;
      const u = rs.filter((r) => r[0] === UNKNOWN);
      if (u.length) return [UNKNOWN, u.map((r) => r[1]).join('；')];
      return [TRUE, rs.map((r) => r[1]).join(' 且 ')];
    }
    if (op === 'or') {
      const rs = node.children.map((c) => this.evaluate(c, drug));
      const t = rs.find((r) => r[0] === TRUE);
      if (t) return t;
      const u = rs.filter((r) => r[0] === UNKNOWN);
      if (u.length) return [UNKNOWN, u.map((r) => r[1]).join('；')];
      return [FALSE, '皆不符合'];
    }
    if (op === 'not') {
      const [r, p] = this.evaluate(node.child, drug);
      if (r === UNKNOWN) return [UNKNOWN, `排除條件待確認（${p}）`];
      return r === TRUE ? [FALSE, `被排除：${p}`] : [TRUE, `非（${p}）`];
    }
    if (op === 'manual') return [UNKNOWN, `人工條件待確認：${node.text}`];

    if (f.type === 'quantity') return this.qty(node, drug);
    let val = drug[f.col];
    val = val === null || val === undefined ? '' : String(val).trim();

    else if (op === 'ne') ok = val !== node.value.trim();
    else if (op === 'in') ok = node.values.some((v) => v.trim() === val);
    else if (op === 'not_in') ok = !node.values.some((v) => v.trim() === val);
    else if (op === 'starts_with') ok = val.startsWith(node.value.trim());
    else ok = !val.startsWith(node.value.trim());
    return [ok ? TRUE : FALSE, `${f.label}=${val} ${TEXT_OPS[op]} ${node.value !== undefined ? node.value : node.values.join(',')}`];
  }

    const q = drug.spec_qty === null || drug.spec_qty === undefined ? null : normalizeMoney(String(drug.spec_qty));

      if (c.mul) qty = mulDec(q, c.mul);
      else return this.cmp(node.op, q, mulDec(want, c.div), unit, `${want}${wantUnit}`);
    }
    return this.cmp(node.op, qty, want, wantUnit, `${want}${wantUnit}`);
  }

  cmp(op, a, b, unit, wantText) {
    const c = compareMoney(a, b);
    const ok = { eq: c === 0, ne: c !== 0, gt: c > 0, ge: c >= 0, lt: c < 0, le: c <= 0 }[op];

  }
}

function mulDec(a, b) {
  const split = (x) => { const [i, f = ''] = x.replace('-', '').split('.'); return { n: BigInt(i + f), s: f.length, neg: x.startsWith('-') }; };

  const sc = x.s + y.s;
  const neg = x.neg !== y.neg;
  let s = n.toString().padStart(sc + 1, '0');
  s = sc ? s.slice(0, s.length - sc) + '.' + s.slice(s.length - sc) : s;
  return normalizeMoney((neg ? '-' : '') + s);
}

function describe(node, depth = 0) {
  const pad = '　'.repeat(depth);
  const op = node.op;
  if (op === 'and' || op === 'or') return `${pad}${LOGIC_OPS[op]}：\n` + node.children.map((c) => describe(c, depth + 1)).join('\n');
  if (op === 'not') return `${pad}排除：\n` + describe(node.child, depth + 1);
  if (op === 'same_applicant') return `${pad}同申請商（統編）另有其他品項符合：\n` + describe(node.child, depth + 1);
  if (op === 'manual') return `${pad}【人工條件】${node.text}`;
  const f = FIELDS[node.field];
  if (f.type === 'quantity') return `${pad}${f.label} ${QTY_OPS[op]} ${node.value} ${node.unit}`;
  return `${pad}${f.label} ${TEXT_OPS[op]} ${node.value !== undefined ? node.value : node.values.join('、')}`;
}

// 待確認原因分類（供批次人工確認）
function pendingReason(path) {
  if (path.includes('人工條件')) return '人工條件';
  if (path.includes('申請商統編缺值')) return '申請商統編缺值';
  if (path.includes('規格缺值')) return '規格缺值';
  if (path.includes('未知或無確認換算') || path.includes('無法比較大小')) return '規格單位未知或無換算';
  const m = /([^\s；=]+)缺值/.exec(path);
  return m ? `${m[1]}缺值` : '其他';
}

// 範圍預覽：rows＝loadMasterRows() 結果；imp＝主檔版本紀錄（取停用欄位與已知單位）
// 範圍全域排除【使用者 2026-11-07 決定】：藥品代碼前綴（預設 TPN）、不上網註＝Y
function exclusionOf(settings) {
  const prefixes = String((settings && settings.scope_exclude_code_prefixes) ?? 'TPN').split(/[\s,，、]+/).map((x) => x.trim()).filter(Boolean);
  return { code_prefixes: prefixes, web_hidden_y: settings ? settings.scope_exclude_web_hidden !== false : true };
}

function excludedReason(d, ex) {
  if (!ex) return null;
  const p = ex.code_prefixes.find((x) => String(d.drug_code).startsWith(x));
  if (p) return `代碼前綴${p}`;
  if (ex.web_hidden_y && String(d.web_hidden ?? '').trim().toUpperCase() === 'Y') return '不上網註＝Y';
  return null;
}

async function previewRule(rule, rows, imp, { threshold = 500, conversions, exclusions } = {}) {
  validateRule(rule);
  if (!imp || imp.status !== '已啟用') throw new SpecError('MASTER_NOT_ACTIVE', '規則預覽須使用已啟用之主檔版本');
  const disabled = (imp.check && imp.check.disabled_rule_fields) || [];
  const missing = [...fieldsUsed(rule)].filter((f) => disabled.includes(f));
  if (missing.length) throw new SpecError('FIELD_DISABLED', '此主檔版本未映射欄位：' + missing.map((f) => FIELDS[f].label).join('、') + '；相關規則停用，請改用含該欄位的主檔或修改條件');
  const ev = new Evaluator({ knownUnits: (imp.check && imp.check.known_units) || [], conversions });
  ev.setRows(rows);
  const members = [];
  const groupTotal = new Map();
  const excluded = {};
  const ex = exclusions || null;
  const webMapped = !ex || !ex.web_hidden_y || [...rows.byCode.values()].some((d) => d.web_hidden !== undefined && d.web_hidden !== null);
  for (const d of rows.byCode.values()) {
    const xr = excludedReason(d, ex);
    const g = d.group_code;
    if (g && !xr) groupTotal.set(g, (groupTotal.get(g) || 0) + 1);
    const [res, path] = ev.evaluate(rule, d);
    // 全域排除：只計入原本會列入（符合或待確認）之品項
    if (xr) { if (res !== FALSE) excluded[xr] = (excluded[xr] || 0) + 1; continue; }
    if (res !== FALSE) {
      members.push({ drug_code: d.drug_code, result: res, path, group_code: g || null, drug_name: d.drug_name || null, firm: d.firm || null,
        spec: `${d.spec_qty ?? ''}${d.spec_unit ?? ''}`, source_row: d.source_row ?? null, annotation: d.annotation ?? null });
    }
  }
  members.sort((a, b) => (a.drug_code < b.drug_code ? -1 : 1));
  const groups = new Map();
  for (const m of members) {
    if (!m.group_code) continue;
    const x = groups.get(m.group_code) || { group_code: m.group_code, matched: 0, pending: 0, total: groupTotal.get(m.group_code) || 0 };
    if (m.result === TRUE) x.matched++; else x.pending++;
    groups.set(m.group_code, x);
  }
  for (const g of groups.values()) g.partial = g.matched + g.pending < g.total;
  const match = members.filter((m) => m.result === TRUE).length;
  const pending = members.length - match;
  const reasons = {};
  // 一個品項可能有多個待確認原因（如分組缺值且規格缺值），各別計數
  for (const m of members) {
    if (m.result !== UNKNOWN) continue;
    for (const k of new Set(m.path.split('；').map(pendingReason))) reasons[k] = (reasons[k] || 0) + 1;
  }
  const warnings = [];
  if (Object.keys(excluded).length) warnings.push('全域排除（不列入範圍）：' + Object.entries(excluded).map(([k, v]) => `${k} ${v}筆`).join('；'));
  if (!webMapped) warnings.push('此主檔版本未映射「不上網註」，未套用不上網註＝Y之排除');
  if (!members.length) warnings.push('零筆符合，請檢查條件');
  if (members.length > threshold) warnings.push(`符合筆數 ${members.length} 超過警示門檻 ${threshold}，請確認範圍`);
  const partial = [...groups.values()].filter((g) => g.partial).map((g) => g.group_code);
  if (partial.length) warnings.push('部分涵蓋分組：' + partial.join('、') + '；分組調價方式須另確認，不得直接將整組排除DET（Q02）');
  if (hasManual(rule)) warnings.push('含人工條件（如跨品項關係），相關品項列為待確認，須逐項人工確認');
  if (Object.keys(reasons).length) warnings.push('待確認原因：' + Object.entries(reasons).map(([k, v]) => `${k} ${v}筆`).join('；'));
  return { members, match, pending, groups: [...groups.values()].sort((a, b) => (a.group_code < b.group_code ? -1 : 1)), warnings, reasons,
    excluded, exclusions: ex ? { ...ex, web_hidden_applied: webMapped } : null,
    rule_hash: await ruleHash(rule), rule_canonical: canonical(rule), import_id: imp.id, base_date: imp.base_date };
}

// ---------- 原文規則草稿解析（Excel移轉用）：無法完整解析時以人工條件保存原文，不猜測 ----------
const ALIASES = [
  [/^分組代碼前(\d+)碼$/, 'group_code', 'prefix'],
  [/^ATC前(\d+)碼$/i, 'atc_code', 'prefix'],
  [/^(分類)?分組代碼$/, 'group_code', null],
  [/^規格量?$/, 'spec', 'qty'],
  [/^ATC7?碼$/i, 'atc_code', null],
  [/^(核價劑型PDOSE|核價劑型|PDOSE)$/i, 'dose_code', null],
  [/^複方藥品$/, 'multi_mark', null],
  [/^(CODE_aggr|CODE|藥品代碼)$/i, 'drug_code', null],
];
const ATC7 = /^[A-Z]\d\d[A-Z][A-Z]\d\d$/;

function prep(t) {
  let s = t;
  for (const [a, b] of [['＝', '='], ['，', ','], ['、', ','], ['＆', '&'], ['（', '('], ['）', ')'], ['﹛', '('], ['﹜', ')'], ['｛', '('], ['｝', ')'], ['　', ' '], ['≠', '<>']]) s = s.split(a).join(b);
  return s.trim();
}

function tokenize(t) {
  const re = /\s*(\(|\)|&|\bor\b|\bOR\b|\bIN\b|\bin\b|<>|!=|=|,|[^\s()&=,<>!]+)/y;
  const toks = [];
  let pos = 0;
  while (pos < t.length) {
    re.lastIndex = pos;
    const m = re.exec(t);
    if (!m || re.lastIndex === pos) {
      if (!t.slice(pos).trim()) break;
      throw new SpecError('RULE_PARSE', `無法辨識「${t.slice(pos, pos + 10)}」`);
    }
    const tok = m[1];
    toks.push(['or', 'in'].includes(tok.toLowerCase()) ? tok.toLowerCase() : tok);
    pos = re.lastIndex;
  }
  return toks;
}

function isField(tk) {
  return ALIASES.some(([re]) => re.test(tk));
}

function parseOr(toks, i) {
  let [left, j] = parseAnd(toks, i);
  const kids = [left];
  while (j < toks.length && toks[j] === 'or') { const [n, k] = parseAnd(toks, j + 1); kids.push(n); j = k; }
  return [kids.length === 1 ? kids[0] : { op: 'or', children: kids }, j];
}

function parseAnd(toks, i) {
  let [left, j] = parseAtom(toks, i);
  const kids = [left];
  while (j < toks.length && toks[j] === '&') { const [n, k] = parseAtom(toks, j + 1); kids.push(n); j = k; }
  return [kids.length === 1 ? kids[0] : { op: 'and', children: kids }, j];
}

function parseAtom(toks, i) {
  const fail = (m) => new SpecError('RULE_PARSE', m);
  if (i >= toks.length) throw fail('條件不完整');
  if (toks[i] === '(') {
    const [n, j] = parseOr(toks, i + 1);
    if (j >= toks.length || toks[j] !== ')') throw fail('括號不對稱');
    return [n, j + 1];
  }
  const name = toks[i];
  let field = null; let kind = null; let digits = null;

function infoRows(info) {
  return [
    ['匯出內容', info.kind],
    ['匯出時間（台北）', taipeiDisplay(info.ms)],
    ['匯出時間（UTC）', isoUtc(info.ms)],
    ['操作者', info.actor || ''],
    ['程式版本', `${APP_VERSION}（${BUILD_COMMIT}）`],
    ['資料結構版本', String(SCHEMA_VERSION)],
    ['資料revision', revisionTag(info.revision, info.unsaved) + (info.unsaved ? '（含未儲存變更，非已儲存版本內容）' : '')],
    ['版本檔SHA-256前16碼', info.versionSha ? info.versionSha.slice(0, 16) : ''],
    ['主檔版本與資料基準日', info.master ? `${info.master.base_date}（${info.master.source_name}，${(info.master.sha256 || '').slice(0, 8)}）` : '（無已啟用主檔）'],

async function logExport(fs, file, info) {
  const entry = {
    exported_at: isoUtc(info.ms), file_name: file.name, kind: info.kind, condition: info.condition || null, count: info.count,
    revision: info.revision, unsaved: !!info.unsaved, app_version: APP_VERSION, schema_version: SCHEMA_VERSION, actor: info.actor || null,
    sha256: await sha256Bytes(file.bytes),
  };
  const cur = await fs.read(P.EXPORT_LOG);
  const text = (cur ? cur.text : '') + JSON.stringify(entry) + '\n';
  await fs.write(P.EXPORT_LOG, text);
  return entry;
}

async function readExportLog(fs) {
  const r = await fs.read(P.EXPORT_LOG);
  if (!r) return [];
  const out = [];
  for (const line of r.text.split('\n')) {
    if (!line.trim()) continue;
    try { out.push(JSON.parse(line)); } catch (e) { out.push({ broken: true, raw: line.slice(0, 80) }); }
  }
  return out;
}

async function findExportBySha(fs, sha) {
  const s = String(sha || '').trim().toLowerCase();
  return (await readExportLog(fs)).filter((e) => e.sha256 === s);
}

  if (rev.confirm_status === '撤銷') throw new SpecError('REVOKED', '已撤銷版本不可建立快照');
